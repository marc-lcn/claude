<style>
:root{
  --navy:#11153a;
  --navy-light:#1b2158;
  --blue:#2f6bff;
  --pink:#ff3ea5;
  --bg:#f2f4fa;
  --card:#ffffff;
  --text:#191c2b;
  --muted:#6c7285;
  --border:#e7e9f2;
  --green-bg:#e3f7e9; --green-text:#1c8a4b;
  --orange-bg:#fff3dc; --orange-text:#b5730a;
  --red-bg:#fde5e5; --red-text:#c22b2b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);}
h1,h2,h3{margin:0 0 4px 0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- LOGIN ---------- */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--navy-light));}
.login-card{background:var(--card);padding:40px 36px;border-radius:20px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-logo{font-size:26px;font-weight:800;margin-bottom:4px;background:linear-gradient(90deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:14px;}
.field input:focus{outline:2px solid var(--blue);border-color:var(--blue);}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;color:var(--muted);}
.btn-primary{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(90deg,var(--blue),var(--pink));color:#fff;font-weight:700;font-size:14px;}
.btn-primary:disabled{opacity:.6;}
.error-msg{background:var(--red-bg);color:var(--red-text);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;}

/* ---------- APP SHELL ---------- */
#app-view{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--navy);color:#cfd3ea;flex-shrink:0;padding:20px 14px;display:flex;flex-direction:column;}
.sidebar-logo{font-size:19px;font-weight:800;color:#fff;padding:6px 10px 22px 10px;}
.sidebar-logo span{background:linear-gradient(90deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;margin-bottom:4px;font-size:14px;font-weight:600;color:#b7bbdc;text-decoration:none;background:none;border:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--navy-light);color:#fff;}
.nav-item.active{background:linear-gradient(90deg,var(--blue),#4b6fff);color:#fff;}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar-foot .who{font-size:12px;color:#9fa4c9;margin-bottom:8px;}
.btn-logout{width:100%;padding:9px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:none;color:#cfd3ea;font-size:13px;}

.main{flex:1;min-width:0;}
.topbar{background:var(--card);padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.topbar h2{font-size:20px;}
.content{padding:26px 28px;max-width:1200px;}

/* mobile nav */
.mobile-toggle{display:none;background:none;border:none;color:#fff;font-size:22px;}
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .mobile-toggle{display:block;}
  .content{padding:16px;}
  .topbar{padding:12px 16px;}
}

/* ---------- CARDS / GRID ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
@media(max-width:520px){.grid-4{grid-template-columns:1fr;}}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(20,22,50,.06);}
.kpi-label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.kpi-value{font-size:24px;font-weight:800;}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:4px;}

.section-title{font-size:15px;font-weight:700;margin:28px 0 12px 0;}

/* ---------- FORMS ---------- */
.form-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end;}
@media(max-width:820px){.form-row{grid-template-columns:1fr 1fr;}}
.form-row .field label{font-size:12.5px;}
.form-row .field input,.form-row .field select{padding:9px 10px;border:1px solid var(--border);border-radius:9px;width:100%;font-size:13.5px;}
.btn{padding:10px 18px;border:none;border-radius:9px;background:var(--blue);color:#fff;font-weight:700;font-size:13.5px;}
.btn.secondary{background:#eef1fb;color:var(--navy);}
.btn.small{padding:6px 12px;font-size:12.5px;}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
.table-wrap{overflow-x:auto;background:var(--card);border-radius:16px;padding:6px 12px;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.badge.green{background:var(--green-bg);color:var(--green-text);}
.badge.orange{background:var(--orange-bg);color:var(--orange-text);}
.badge.red{background:var(--red-bg);color:var(--red-text);}
.row-select,.row-input{padding:5px 6px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;max-width:180px;}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.tab-btn{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.upload-box{border:2px dashed var(--border);border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-size:13.5px;background:#fbfcfe;}
.upload-box input{display:none;}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;}
.empty{color:var(--muted);font-size:13.5px;padding:20px;text-align:center;}
tr.ligne-fermee{background:#eef0f6;}
tr.ligne-fermee td{color:var(--muted);}
tr.ligne-fermee input[type="number"]{background:#e5e7f0;}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.checklist-item{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);}
.checklist-item:last-child{border-bottom:none;}
.checklist-icon{font-size:18px;line-height:1.4;}
.checklist-label{font-weight:700;font-size:13.5px;}
.checklist-detail{font-size:12.5px;color:var(--muted);margin-top:2px;}
.param-toggle{width:100%;text-align:left;background:none;border:none;font-weight:700;font-size:15px;cursor:pointer;color:var(--text);display:flex;justify-content:space-between;align-items:center;padding:16px 20px;}
.param-toggle:hover{background:#f7f8fc;}
.mois-content::-webkit-scrollbar{height:10px;}
.mois-content::-webkit-scrollbar-thumb{background:#c7cbe0;border-radius:6px;}
.mois-content::-webkit-scrollbar-track{background:#f2f4fa;}
.hscroll-top{overflow-x:auto;overflow-y:hidden;height:14px;border-bottom:1px solid var(--border);}
.hscroll-top-inner{height:1px;}
.hscroll-top::-webkit-scrollbar{height:10px;}
.hscroll-top::-webkit-scrollbar-thumb{background:#9aa0c4;border-radius:6px;}
.hscroll-top::-webkit-scrollbar-track{background:#f2f4fa;}
.hscroll-body{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.hscroll-body::-webkit-scrollbar{height:10px;}
.hscroll-body::-webkit-scrollbar-thumb{background:#c7cbe0;border-radius:6px;}
.hscroll-body::-webkit-scrollbar-track{background:#f2f4fa;}
.pill-toggle{padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
.pill-toggle:hover{border-color:var(--blue);color:var(--navy);}
.pill-toggle.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){.grid-3{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-view">
  <div class="login-card">
    <div class="login-logo">GEM.VAP <span>Pilotage</span></div>
    <div class="login-sub">Connexion réservée au dirigeant</div>

</div>

<!-- ================= APP ================= -->
<div id="app-view">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">GEM.VAP <span>Pilotage</span></div>
      <button class="nav-item active" data-page="dashboard">📊 Tableau de bord</button>
      <button class="nav-item" data-page="ca">🧾 Saisie du CA</button>
      <button class="nav-item" data-page="banque">🏦 Import bancaire</button>
      <button class="nav-item" data-page="salaries">👥 Salariés</button>
      <button class="nav-item" data-page="controle">✅ Opérations à contrôler</button>
      <button class="nav-item" data-page="analyse">🏬 Analyse par magasin</button>
      <button class="nav-item" data-page="journal">🧾 Journal des ventes</button>

    <div class="main">
      <div class="topbar">

</div>

<script>
/* ============================================================
   CONFIGURATION SUPABASE
   ============================================================ */
const SUPABASE_URL = "https://qulvninnozpoefmptvnk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1bHZuaW5ub3pwb2VmbXB0dm5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2OTA3MjgsImV4cCI6MjA5OTI2NjcyOH0.OciOmKi8DFre1_Z2_7WDFcBqkYeCjf_Pxyco19ZFit8";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   ETAT GLOBAL
   ============================================================ */
let STATE = {
  magasins: [],
  categories: [],
  exercices: [],
  collaborateurs: [],
  currentExercice: null,
  regles: [],
  page: 'dashboard'
};

function fmtEUR(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('fr-FR');
}
// Formate un objet Date en 'YYYY-MM-DD' à partir de ses composantes LOCALES.
// Ne jamais utiliser .toISOString().slice(0,10) pour ça : ça convertit en UTC
// et décale la date d'un jour en arrière l'été en France (UTC+2), ce qui a déjà
// fait disparaître silencieusement le dernier jour du mois de plusieurs calculs.
function toLocalISODate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3200);
}

/* ============================================================
   AUTHENTIFICATION
   ============================================================ */
const loginView = document.getElementById('login-view');
const appView = document.getElementById('app-view');
const loginForm = document.getElementById('login-form');
const loginError = document.getElementById('login-error');
const loginBtn = document.getElementById('login-btn');

loginForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  loginError.innerHTML = '';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Connexion...';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  loginBtn.textContent = 'Se connecter';
  if(error){
    loginError.innerHTML = `<div class="error-msg">Connexion impossible : e-mail ou mot de passe incorrect.</div>`;
  }
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
});

let APP_INITIALIZED = false;

sb.auth.onAuthStateChange((event, session)=>{
  if(session){
    if(!APP_INITIALIZED){
      showApp(session);
    } else {
      // Déjà connecté et affiché : on ne fait que rafraîchir l'e-mail affiché,
      // sans revenir au tableau de bord (ex : retour sur l'onglet du navigateur).
      const who = document.getElementById('who-label');
      if(who) who.textContent = session.user.email;
    }
  } else {
    APP_INITIALIZED = false;
    loginView.style.display='flex';
    appView.style.display='none';
  }
});

async function showApp(session){
  APP_INITIALIZED = true;
  loginView.style.display='none';
  appView.style.display='block';
  document.getElementById('who-label').textContent = session.user.email;
  await loadReferenceData();
  goToPage('dashboard');
}

/* ============================================================
   DONNEES DE REFERENCE (magasins, categories, exercices)
   ============================================================ */
async function loadReferenceData(){
  const [{data:magasins}, {data:categories}, {data:exercices}, {data:collaborateurs}] = await Promise.all([
    sb.from('magasins').select('*').eq('actif', true).order('ordre_affichage'),
    sb.from('categories').select('*').eq('actif', true).order('libelle'),
    sb.from('exercices').select('*').order('date_debut', {ascending:false}),
    sb.from('collaborateurs').select('*').eq('actif', true).order('nom')
  ]);
  STATE.magasins = magasins || [];
  STATE.categories = categories || [];
  STATE.exercices = exercices || [];
  STATE.collaborateurs = collaborateurs || [];

  const aujourdHui = toLocalISODate(new Date());
  STATE.currentExercice =
    STATE.exercices.find(e => aujourdHui >= e.date_debut && aujourdHui <= e.date_fin)
    || STATE.exercices.find(e=>e.actif)
    || STATE.exercices[0];
}

// Liste des affectations possibles (magasins actifs + valeurs spéciales), toujours à jour
function affectationsDisponibles(){
  return [...STATE.magasins.map(m=>m.code), 'COMMUN', 'DIRIGEANT'];
}

/* ============================================================
   NAVIGATION
   ============================================================ */
document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
  btn.addEventListener('click', ()=>goToPage(btn.dataset.page));
});
document.getElementById('mobile-toggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

const PAGE_TITLES = {
  dashboard: 'Tableau de bord',
  ca: 'Saisie du chiffre d\'affaires',
  banque: 'Import bancaire',
  salaries: 'Salariés',
  controle: 'Opérations à contrôler',
  analyse: 'Analyse par magasin',
  journal: 'Journal des ventes',
  parametres: 'Paramètres'
};

function goToPage(page){
  STATE.page = page;
  document.querySelectorAll('.nav-item[data-page]').forEach(b=>{
    b.classList.toggle('active', b.dataset.page===page);
  });
  document.getElementById('page-title').textContent = PAGE_TITLES[page];
  document.getElementById('sidebar').classList.remove('open');
  renderPage();
}

function renderPage(){
  if(STATE.page==='dashboard') renderDashboard();
  else if(STATE.page==='ca') renderCaPage();
  else if(STATE.page==='banque') renderBanquePage();
  else if(STATE.page==='salaries') renderSalariesPage();
  else if(STATE.page==='controle') renderControlePage();
  else if(STATE.page==='analyse') renderAnalysePage();
  else if(STATE.page==='journal') renderJournalVentesPage();
  else if(STATE.page==='parametres') renderParametresPage();
}

/* ============================================================
   PAGE : TABLEAU DE BORD
   ============================================================ */
async function renderDashboard(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="empty">Chargement...</div>`;
  if(!STATE.currentExercice){ content.innerHTML = `<div class="empty">Aucun exercice actif.</div>`; return; }

  const now = new Date();
  const moisStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthStart = toLocalISODate(new Date(now.getFullYear(), now.getMonth(), 1));
  const monthEnd = toLocalISODate(new Date(now.getFullYear(), now.getMonth()+1, 0));

  // Le relevé bancaire et les bulletins de salaire concernent le MOIS PRÉCÉDENT
  // (on ne les reçoit qu'une fois le mois clôturé)
  const moisPrecedentDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const moisPrecedentStr = `${moisPrecedentDate.getFullYear()}-${String(moisPrecedentDate.getMonth()+1).padStart(2,'0')}`;
  const moisPrecedentLabel = moisPrecedentDate.toLocaleDateString('fr-FR',{month:'long', year:'numeric'});

  const [
    { data: caRows },
    { count: aControlerCount },
    { data: importsBanque },
    { count: sansJustifCount },
    { data: salairesMois }
  ] = await Promise.all([
    sb.from('ca_journalier')
      .select('*, magasins(code,nom)')
      .eq('exercice_id', STATE.currentExercice.id)
      .gte('date_operation', monthStart)
      .lte('date_operation', monthEnd),
    sb.from('operations_bancaires')
      .select('id', {count:'exact', head:true})
      .eq('exercice_id', STATE.currentExercice.id)
      .in('etat', ['a_verifier','a_categoriser']),
    sb.from('imports')
      .select('*')
      .eq('type_import', 'banque')
      .eq('mois', moisPrecedentStr),
    sb.from('operations_bancaires')
      .select('id', {count:'exact', head:true})
      .eq('exercice_id', STATE.currentExercice.id)
      .gte('date_operation', monthStart).lte('date_operation', monthEnd+'T23:59:59')
      .not('debit','is', null)
      .is('piece_jointe_path', null)
      .eq('justificatif_non_requis', false),
    sb.from('salaires')
      .select('collaborateur_id, imports:document_id(chemin_storage)')
      .eq('mois', moisPrecedentStr)
  ]);

  const rows = caRows || [];
  const totalCA = rows.reduce((s,r)=>s + Number(r.ca_ht||0), 0);
  const totalTickets = rows.reduce((s,r)=>s + Number(r.nb_tickets||0), 0);
  const panierMoyen = totalTickets>0 ? totalCA/totalTickets : null;

  const parMagasin = {};
  STATE.magasins.forEach(m=>parMagasin[m.id] = {nom:m.nom, ca:0});
  rows.forEach(r=>{
    if(parMagasin[r.magasin_id]) parMagasin[r.magasin_id].ca += Number(r.ca_ht||0);
  });

  // Check-list du mois : CA saisi par magasin, sur les jours "requis" seulement
  // (dimanches et jours fériés exclus ; aujourd'hui n'est exigé qu'à partir de 21h)
  let limiteDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(now.getHours() < 21) limiteDate.setDate(limiteDate.getDate()-1);
  const limiteISO = toLocalISODate(limiteDate);
  const finPourComptageRequis = limiteISO < monthStart ? null : (limiteISO > monthEnd ? monthEnd : limiteISO);

  const feriesAnnee = joursFeriesFrance(now.getFullYear());
  const joursRequisListe = [];
  if(finPourComptageRequis){
    const dernierJour = new Date(finPourComptageRequis+'T00:00:00').getDate();

function pâquesDate(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30;
  const i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7;
  const mm = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*mm+114)/31);
  const day = ((h+l-7*mm+114)%31)+1;
  return new Date(year, month-1, day);
}
function joursFeriesFrance(year){
  const paques = pâquesDate(year);
  const add = (base, days) => { const dd=new Date(base); dd.setDate(dd.getDate()+days); return dd; };
  const toISO = (dd) => `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
  return new Set([
    toISO(new Date(year,0,1)), toISO(add(paques,1)), toISO(new Date(year,4,1)), toISO(new Date(year,4,8)),
    toISO(add(paques,39)), toISO(add(paques,50)), toISO(new Date(year,6,14)), toISO(new Date(year,7,15)),
    toISO(new Date(year,10,1)), toISO(new Date(year,10,11)), toISO(new Date(year,11,25))
  ]);
}

async function loadCaGrid(){
  const body = document.getElementById('ca-grid-body');
  const magasin = STATE.magasins.find(m=>m.code===CA_MAGASIN_CODE);
  if(!magasin){ body.innerHTML = `<div class="empty">Magasin introuvable.</div>`; return; }

  const [y,m] = CA_MOIS_SELECTED.split('-').map(Number);
  const nbJours = new Date(y, m, 0).getDate();
  const dateDebut = `${CA_MOIS_SELECTED}-01`;
  const dateFin = `${CA_MOIS_SELECTED}-${String(nbJours).padStart(2,'0')}`;
  const feries = joursFeriesFrance(y);

  const { data } = await sb.from('ca_journalier').select('*')
    .eq('magasin_id', magasin.id)
    .gte('date_operation', dateDebut).lte('date_operation', dateFin);

  const parJour = {};
  (data||[]).forEach(r=> parJour[r.date_operation] = r);

  let rowsHtml = '';
  for(let d=1; d<=nbJours; d++){
    const dateStr = `${CA_MOIS_SELECTED}-${String(d).padStart(2,'0')}`;
    const existing = parJour[dateStr];
    const dObj = new Date(dateStr+'T00:00:00');
    const jourLabel = dObj.toLocaleDateString('fr-FR', {weekday:'short', day:'2-digit', month:'2-digit'});
    const isDimanche = dObj.getDay()===0;
    const isFerie = feries.has(dateStr);
    const ca = existing?.ca_ht ?? '';
    const tickets = existing?.nb_tickets ?? '';
    const ferme = existing ? !!existing.ferme : (isDimanche || isFerie);
    const feriePuce = isFerie ? ' <span style="color:var(--pink);font-size:11px;">(férié)</span>' : '';
    rowsHtml += `
      <tr data-date="${dateStr}" class="${ferme?'ligne-fermee':''}">
        <td style="text-transform:capitalize;font-weight:600;">${jourLabel}${feriePuce}</td>
        <td><input type="number" step="0.01" inputmode="decimal" class="row-input ca-input" value="${ca}" placeholder="0,00" style="width:110px;" ${ferme?'disabled':''}></td>
        <td><input type="number" inputmode="numeric" class="row-input tickets-input" value="${tickets}" placeholder="0" style="width:80px;" ${ferme?'disabled':''}></td>
        <td class="panier-cell">—</td>
        <td style="text-align:center;"><input type="checkbox" class="ferme-input" ${ferme?'checked':''} title="Magasin fermé"></td>
      </tr>`;
  }

  body.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Jour</th><th>CA HT (€)</th><th>Tickets</th><th>Panier moyen</th><th>Fermé</th></tr></thead>
        <tbody id="ca-grid-tbody">${rowsHtml}</tbody>
        <tfoot>
          <tr style="font-weight:700;background:#f7f8fc;">
            <td>Total</td>
            <td id="total-ca">—</td>
            <td id="total-tickets">—</td>
            <td id="total-panier">—</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="hint" style="margin-top:10px;">Chaque case s'enregistre automatiquement dès que vous en sortez. Les dimanches et jours fériés sont grisés et la case « Fermé » est cochée par défaut — décochez-la si le magasin était exceptionnellement ouvert.</div>
  `;

  function recalcTotals(){
    let totalCa=0, totalTickets=0;
    document.querySelectorAll('#ca-grid-tbody tr').forEach(tr=>{
      const ca = parseFloat(tr.querySelector('.ca-input').value)||0;
      const tickets = parseInt(tr.querySelector('.tickets-input').value)||0;
      totalCa += ca; totalTickets += tickets;
      tr.querySelector('.panier-cell').textContent = (ca>0 && tickets>0) ? fmtEUR(ca/tickets) : '—';
    });
    document.getElementById('total-ca').textContent = fmtEUR(totalCa);
    document.getElementById('total-tickets').textContent = totalTickets;
    document.getElementById('total-panier').textContent = totalTickets>0 ? fmtEUR(totalCa/totalTickets) : '—';
  }
  recalcTotals();

  document.querySelectorAll('#ca-grid-tbody tr').forEach(tr=>{
    const dateStr = tr.dataset.date;
    const caInput = tr.querySelector('.ca-input');
    const ticketsInput = tr.querySelector('.tickets-input');
    const fermeInput = tr.querySelector('.ferme-input');

    async function save(){
      recalcTotals();
      const caVal = caInput.value;
      const ca = caVal === '' ? null : parseFloat(caVal);
      const tickets = ticketsInput.value ? parseInt(ticketsInput.value) : null;
      const ferme = fermeInput.checked;
      const exercice = findExerciceForDate(dateStr);
      if(!exercice){ toast(`Aucun exercice comptable ne couvre le ${fmtDate(dateStr)}.`); return; }
      const { error } = await sb.from('ca_journalier').upsert({
        exercice_id: exercice.id,
        date_operation: dateStr,
        magasin_id: magasin.id,
        ca_ht: ca,
        nb_tickets: tickets,
        ferme: ferme
      }, { onConflict: 'date_operation,magasin_id' });
      if(error){ toast('Erreur : ' + error.message); return; }
    }

    caInput.addEventListener('input', recalcTotals);
    ticketsInput.addEventListener('input', recalcTotals);
    caInput.addEventListener('change', save);
    ticketsInput.addEventListener('change', save);
    fermeInput.addEventListener('change', ()=>{
      tr.classList.toggle('ligne-fermee', fermeInput.checked);
      caInput.disabled = fermeInput.checked;
      ticketsInput.disabled = fermeInput.checked;
      save();
    });
  });
}

    groups[annee].push(imp);
  });

  if(OPEN_ANNEES_IMPORTS.size===0 && annees.length>0) OPEN_ANNEES_IMPORTS.add(annees[0]);

  container.innerHTML = annees.map(annee=>{

    <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px;">

      </button>
      <div class="mois-content" data-annee-content="${annee}" style="display:${isOpen?'block':'none'};border-top:1px solid var(--border);overflow-x:auto;">
        <table>
          <thead><tr><th>Mois</th><th>Nom du fichier</th><th>Document original</th></tr></thead>
          <tbody>
            ${liste.map(imp=>{
              const moisLabel = imp.mois ? new Date(imp.mois+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'}) : '—';
              const docCell = imp.chemin_storage
                ? `<a href="#" class="voir-doc-link" data-path="${imp.chemin_storage}" style="color:var(--blue);font-weight:600;text-decoration:none;">📎 Voir le document</a>

            }).join('')}

      </div>

  }).join('');

  container.querySelectorAll('.mois-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const annee = btn.dataset.annee;

async function handleDocumentUpload(bucket, importId, file, onDone){
  if(!file) return;
  toast('Envoi du fichier...');
  const path = `${importId}/${Date.now()}_${sanitizeFilename(file.name)}`;
  const { error: uploadErr } = await sb.storage.from(bucket).upload(path, file, { upsert:true });
  if(uploadErr){
    alert(`Erreur lors de l'envoi :\n` + uploadErr.message + `\n\nVérifiez que le bucket "${bucket}" existe bien dans Supabase > Storage.`);
    return;
  }
  const { error: updateErr } = await sb.from('imports').update({ chemin_storage: path }).eq('id', importId);
  if(updateErr){ toast('Erreur : ' + updateErr.message); return; }
  toast('Document attaché ✔');
  onDone();
}

async function voirDocument(bucket, path){
  if(!path) return;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 60);
  if(error){ toast('Impossible d\'ouvrir le fichier : ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

async function handleBankFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('import-status');
  const uploadLabel = document.getElementById('upload-label');
  const resetLabel = () => { uploadLabel.textContent = '📄 Cliquez pour choisir le fichier Excel exporté du Crédit Agricole'; e.target.value = ''; };

  if(!/\.(xlsx|xls)$/i.test(file.name)){
    statusEl.innerHTML = `<div class="error-msg">« ${file.name} » n'est pas un fichier Excel (.xlsx/.xls) — c'est le seul format que cette case sait lire automatiquement. Si vous n'avez que le PDF du relevé, il doit être importé manuellement puis attaché dans « Relevés déjà importés » ci-dessous.</div>`;
    resetLabel();
    return;
  }

  uploadLabel.textContent = '⏳ ' + file.name + ' — lecture en cours...';

  let rawRows;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { cellDates:true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    rawRows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:null });
  } catch(err){
    statusEl.innerHTML = `<div class="error-msg">Impossible de lire « ${file.name} » : le fichier semble corrompu ou n'est pas un vrai fichier Excel (${err.message}).</div>`;
    resetLabel();
    return;
  }

  // Trouver la ligne d'en-tête (contient "Date" et "Libell")
  let headerIdx = -1, colDate=-1, colLibelle=-1, colDebit=-1, colCredit=-1;
  for(let i=0;i<rawRows.length;i++){
    const row = rawRows[i].map(c=> (c==null?'':String(c)).toLowerCase());
    const dIdx = row.findIndex(c=>c.includes('date'));
    const lIdx = row.findIndex(c=>c.includes('libell'));
    if(dIdx>-1 && lIdx>-1){
      headerIdx=i; colDate=dIdx; colLibelle=lIdx;
      colDebit = row.findIndex(c=>c.includes('débit') || c.includes('debit'));
      colCredit = row.findIndex(c=>c.includes('crédit') || c.includes('credit'));
      break;
    }
  }
  if(headerIdx===-1){
    statusEl.innerHTML = `<div class="error-msg">Impossible de trouver les colonnes Date / Libellé dans ce fichier.</div>`;
    document.getElementById('upload-label').textContent = '📄 Cliquez pour choisir le fichier Excel exporté du Crédit Agricole';
    return;
  }

  const dataRows = rawRows.slice(headerIdx+1).filter(r=>r[colDate] && r[colLibelle]);
  if(dataRows.length===0){
    statusEl.innerHTML = `<div class="error-msg">Aucune opération trouvée dans le fichier.</div>`;
    return;
  }

  // Charger les règles de catégorisation actives (triées par priorité)
  const { data: regles } = await sb.from('regles_categorisation').select('*').eq('actif', true).order('priorite');
  STATE.regles = regles || [];

  // Déterminer le mois majoritaire du relevé (pour le suivi mensuel)
  const moisCompte = {};
  dataRows.forEach(r=>{
    let dv = r[colDate];
    dv = dv instanceof Date ? dv : new Date(dv);
    if(isNaN(dv)) return;
    const key = `${dv.getFullYear()}-${String(dv.getMonth()+1).padStart(2,'0')}`;
    moisCompte[key] = (moisCompte[key]||0) + 1;
  });
  const moisMajoritaire = Object.entries(moisCompte).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;

  // Créer la ligne d'import (rattachée à l'exercice du mois majoritaire du fichier)
  const exerciceImport = moisMajoritaire ? findExerciceForDate(`${moisMajoritaire}-01`) : null;
  const { data: importRow, error: importErr } = await sb.from('imports').insert({
    exercice_id: exerciceImport?.id || null,
    type_import: 'banque',
    mois: moisMajoritaire,
    nom_fichier: file.name,
    statut: 'importé'
  }).select().single();
  if(importErr){ statusEl.innerHTML = `<div class="error-msg">Erreur lors de l'import : ${importErr.message}</div>`; return; }

  const toInsert = dataRows.map(r=>{
    let dateVal = r[colDate];
    if(dateVal instanceof Date) dateVal = dateVal.toISOString();
    else dateVal = new Date(dateVal).toISOString();

    const libelle = String(r[colLibelle]);
    const debit = colDebit>-1 ? parseMontant(r[colDebit]) : null;
    const credit = colCredit>-1 ? parseMontant(r[colCredit]) : null;

    const match = matchRegle(libelle);
    let etat = 'a_categoriser';
    if(match){
      etat = match.validation_auto ? 'valide_manuel' : (match.confiance >= 95 ? 'reconnu_auto' : 'a_verifier');
    }
    const exerciceOp = findExerciceForDate(dateVal.slice(0,10));

    return {
      exercice_id: exerciceOp?.id || null,
      import_id: importRow.id,
      date_operation: dateVal,
      libelle: libelle,
      debit: debit,
      credit: credit,
      categorie_proposee_id: match ? match.categorie_id : null,
      categorie_finale_id: (match && match.validation_auto) ? match.categorie_id : null,
      affectation: (match && match.affectation) ? match.affectation : 'COMMUN',
      mot_cle_reconnu: match ? match.mot_cle : null,
      confiance: match ? match.confiance : 0,
      etat: etat,
      valide_manuellement: !!(match && match.validation_auto)
    };
  });

  const { error: insertErr } = await sb.from('operations_bancaires').insert(toInsert);
  document.getElementById('upload-label').textContent = '📄 Cliquez pour choisir le fichier Excel exporté du Crédit Agricole';
  if(insertErr){
    statusEl.innerHTML = `<div class="error-msg">Erreur lors de l'enregistrement : ${insertErr.message}</div>`;
    return;
  }
  const reconnues = toInsert.filter(r=>r.etat==='reconnu_auto').length;
  statusEl.innerHTML = `<div class="badge green" style="font-size:13px;">${toInsert.length} opérations importées — ${reconnues} reconnues automatiquement</div>
    <div class="hint">Rendez-vous dans « Opérations à contrôler » pour vérifier le reste.</div>`;
}

function parseMontant(v){
  if(v===null || v===undefined || v==='') return null;
  if(typeof v === 'number') return v;
  const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.'));
  return isNaN(n) ? null : n;
}

function matchRegle(libelle){
  const low = libelle.toLowerCase();
  for(const r of STATE.regles){
    if(low.includes(r.mot_cle.toLowerCase())){
      return r;
    }
  }
  return null;
}

const MOIS_FR = {
  janvier:1, fevrier:2, mars:3, avril:4, mai:5, juin:6,
  juillet:7, aout:8, septembre:9, octobre:10, novembre:11, decembre:12
};

function sansAccents(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'');
}

// Reconnaît le format "NOM_Prenom_Bulletin_Mois_Annee.pdf" (ou "..._Solde_de_tout_compte_...")
function parseNomFichierBulletin(filename){
  const base = filename.replace(/\.pdf$/i, '');
  const m = base.match(/^(.+?)_(Bulletin|Solde[_ ]?de[_ ]?tout[_ ]?compte)_([A-Za-zÀ-ÿ]+)_(\d{4})$/i);
  if(!m) return { personSegment: base.replace(/_/g,' '), typeDocument: 'bulletin', mois: null };
  const [, personSegment, typeRaw, moisRaw, anneeRaw] = m;
  const typeDocument = /solde/i.test(typeRaw) ? 'solde_tout_compte' : 'bulletin';
  const moisNum = MOIS_FR[sansAccents(moisRaw).toLowerCase()];
  const mois = moisNum ? `${anneeRaw}-${String(moisNum).padStart(2,'0')}` : null;
  return { personSegment: personSegment.replace(/_/g,' '), typeDocument, mois };
}

// Retrouve le salarié correspondant, quel que soit l'ordre nom/prénom dans le nom de fichier
function deviverCollaborateur(personSegment){
  const norm = sansAccents(personSegment).toUpperCase();
  const tokens = norm.split(/\s+/).filter(Boolean);
  return STATE.collaborateurs.find(c=>{
    const cNorm = sansAccents(c.nom).toUpperCase();
    return norm.includes(cNorm) || tokens.some(t=>t.length>2 && cNorm.includes(t));
  }) || null;
}

function calculerAnciennete(dateEntree, dateSortie){
  if(!dateEntree) return '—';
  const debut = new Date(dateEntree+'T00:00:00');
  const fin = dateSortie ? new Date(dateSortie+'T00:00:00') : new Date();
  let mois = (fin.getFullYear()-debut.getFullYear())*12 + (fin.getMonth()-debut.getMonth());
  if(fin.getDate() < debut.getDate()) mois--;
  if(mois < 0) return '—';
  const ans = Math.floor(mois/12);
  const moisRestants = mois % 12;
  if(ans===0) return `${moisRestants} mois`;
  if(moisRestants===0) return `${ans} an${ans>1?'s':''}`;
  return `${ans} an${ans>1?'s':''} ${moisRestants} mois`;
}

/* ============================================================
   EXTRACTION AUTOMATIQUE DES BULLETINS PDF
   ============================================================ */
async function extraireItemsPdf(fileOrBlob){
  const buf = await fileOrBlob.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  let items = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    items = items.concat(content.items.map(it=>({ str: it.str, x: it.transform[4], y: it.transform[5] })));
  }
  return items;
}

// Reconstruit les nombres à partir d'une liste de chaînes (items pdf.js) : évite l'ambiguïté
// du séparateur de milliers français ("1" " " "975.16") vs deux nombres adjacents distincts.
function extraireNombresDepuisItems(arr){
  const nombres = [];
  for(let i=0;i<arr.length;i++){
    const it = arr[i];
    if(/^\d{1,3}$/.test(it) && arr[i+1]===' ' && /^\d{3}[.,]\d{2}$/.test(arr[i+2])){
      nombres.push(parseFloat((it+arr[i+2]).replace(',','.')));
      i += 2;
    } else if(/^-?\d+[.,]\d{2}$/.test(it)){
      nombres.push(parseFloat(it.replace(',','.')));
    }
  }
  return nombres;
}

// Le tableau "Congés N-1 / Congés N" (Acquis/Pris/Solde) est toujours en bas à gauche
// de la page, à un emplacement fixe du modèle — on le repère par coordonnées plutôt que
// par ordre du texte, pour distinguer sans ambiguïté quelle case précise est vide (= 0).
function extraireCongesDepuisItems(items){
  const labelAcquis = items.find(it=>it.str.trim()==='Acquis');
  const labelPris = items.find(it=>it.str.trim()==='Pris');
  const labelSolde = items.find(it=>it.str.trim()==='Solde');
  const labelColN1 = items.find(it=>it.str.trim()==='N-1');
  if(!labelAcquis || !labelPris || !labelSolde || !labelColN1) return null;

  const seuilColonne = labelColN1.x + 40;
  function valeurLigne(yCible){
    const candidats = items.filter(it =>
      Math.abs(it.y - yCible) < 3 && it.x < 200 && /^-?\d+[.,]\d{2}$/.test(it.str.trim())
    );
    const n1 = candidats.find(it => it.x < seuilColonne);
    const n = candidats.find(it => it.x >= seuilColonne);
    return {
      n1: n1 ? parseFloat(n1.str.replace(',','.')) : 0,
      n: n ? parseFloat(n.str.replace(',','.')) : 0,
    };
  }
  return { solde: valeurLigne(labelSolde.y) };
}

// Cherche le premier nombre qui suit un libellé donné (ex: "Titres-restaurant"),
// en tolérant que le libellé soit scindé en plusieurs items pdf.js.
function chercherValeurApresLibelle(items, regexLibelle){
  for(let i=0;i<items.length;i++){
    let assemble = '';
    let j = i;
    while(j<items.length && assemble.length<60){
      assemble += items[j].str;
      j++;
      if(regexLibelle.test(assemble)) break;
    }
    if(regexLibelle.test(assemble)){
      const suite = items.slice(j, j+8).map(it=>it.str);
      const nombres = extraireNombresDepuisItems(suite);
      if(nombres.length>0) return nombres[0];
    }
  }
  return null;
}

// Calé sur le modèle de bulletin GEM.VAP (ligne d'en-tête "##BULLETIN##MM-YYYY##...",
// tableau récap Mensuel/Annuel en fin de document). Renvoie null pour tout champ non
// reconnu avec certitude — jamais de valeur devinée au hasard (sauf congés : case vide = 0,
// confirmé par vérification manuelle de plusieurs bulletins).
function analyserBulletinPdf(items){
  const rawItems = items.map(it=>it.str);
  const texte = rawItems.join(' ').replace(/\s+/g,' ').trim();
  const res = { typeDocument:null, mois:null, matricule:null, nom:null, niveau:null,
    statutPro:null, dateEntree:null, brut:null, netPaye:null, chargesPatronales:null, coutGlobal:null,
    congesN1:null, congesN:null, titresRestaurant:null };

  const mHeader = texte.match(/##(BULLETIN|SOLDECPT)##(\d{2})-(\d{4})##(\d+)##([^#]+)##([^#]+)##(\d+)/);
  if(mHeader){
    res.typeDocument = mHeader[1]==='SOLDECPT' ? 'solde_tout_compte' : 'bulletin';
    res.mois = `${mHeader[3]}-${mHeader[2]}`;
    res.matricule = mHeader[4];
    res.nom = `${mHeader[5]} ${mHeader[6]}`;
  }

  const mStatut = texte.match(/(Cadre|Employé|Employée|Apprenti|Ouvrier|Agent de maîtrise)\s+(\S+)\s+(\d{2})\/(\d{2})\/(\d{4})/);
  if(mStatut){
    res.statutPro = mStatut[1];
    res.niveau = mStatut[2];
    res.dateEntree = `${mStatut[5]}-${mStatut[4]}-${mStatut[3]}`;
  }

  // Ligne "Salaire brut X" juste avant "Santé" : source indépendante du tableau récap,
  // fiable même quand la mise en page du tableau change (voir plus bas).
  const mBrut = texte.match(/Salaire brut\s+([\d\s.,]+?)\s+Santé/);
  if(mBrut) res.brut = parseFloat(mBrut[1].replace(/\s/g,'').replace(',','.'));

  const mNetSolde = texte.match(/somme nette de \**\s*([\d\s.,]+?)\s*Euros/i);
  if(mNetSolde) res.netPaye = parseFloat(mNetSolde[1].replace(/\s/g,'').replace(',','.'));

  const mNet = texte.match(/Net payé\s*:\s*([\d\s.,]+?)\s*euros/i);
  if(mNet) res.netPaye = parseFloat(mNet[1].replace(/\s/g,'').replace(',','.'));

  // Le tableau récap n'a la colonne "Heures suppl." que les mois avec heures supplémentaires :
  // sans détection dynamique, toutes les colonnes suivantes (Brut, Ch. patronales, Coût Global)
  // se décaleraient d'une case les mois sans heures sup — repéré en comparant deux vrais
  // bulletins d'un même salarié, l'un avec et l'autre sans heures supplémentaires.
  const zoneEntete = texte.slice(0, texte.indexOf('Mensuel') > -1 ? texte.indexOf('Mensuel') : 300);
  const aHeuresSuppl = /Heures\s+suppl\./.test(zoneEntete);
  const idxBrut = aHeuresSuppl ? 4 : 2;
  const idxChargesPatronales = aHeuresSuppl ? 10 : 8;
  const idxCoutGlobal = aHeuresSuppl ? 12 : 10;

  // Isole le segment entre l'avant-dernière et la dernière occurrence de "Net payé"
  // (le tableau récap Mensuel/Annuel s'y trouve toujours, juste avant la ligne finale)
  const idxNetPaye = [];
  for(let i=0;i<rawItems.length;i++){
    if(rawItems[i]==='Net' && rawItems[i+2]==='payé') idxNetPaye.push(i);
  }
  if(idxNetPaye.length>=2){
    const debut = idxNetPaye[idxNetPaye.length-2];
    const fin = idxNetPaye[idxNetPaye.length-1];
    const segment = rawItems.slice(debut, fin);
    const bloc = extraireNombresDepuisItems(segment).slice(1); // ignore la valeur du "Net payé" du corps
    if(res.brut==null && bloc.length>idxBrut) res.brut = bloc[idxBrut];
    if(bloc.length>idxCoutGlobal){
      res.chargesPatronales = bloc[idxChargesPatronales];
      res.coutGlobal = bloc[idxCoutGlobal];
    }
  }

  const conges = extraireCongesDepuisItems(items);
  if(conges){ res.congesN1 = conges.solde.n1; res.congesN = conges.solde.n; }

  const titres = chercherValeurApresLibelle(items, /Titres[\s-]*restaurant/i);
  if(titres!=null) res.titresRestaurant = titres;

  return res;
}

// Ne remplit que les champs actuellement vides — ne recouvre jamais une valeur déjà
// saisie ou déjà vérifiée manuellement. Renvoie toujours { ok, reason } — reason explique
// précisément ce qui s'est passé (utile pour diagnostiquer sans ouvrir la console).
async function attendrePdfjs(timeoutMs=8000){
  const debut = Date.now();
  while(!window.pdfjsLib){
    if(Date.now()-debut > timeoutMs) return false;
    await new Promise(r=>setTimeout(r, 150));
  }
  return true;
}

async function appliquerExtractionSurSalaire(salaireRow, collaborateurId, fileOrBlob){
  if(!(await attendrePdfjs())) return { ok:false, reason:'pdf.js non chargé après 8 secondes (bloqueur de script/pub ? pas de connexion internet ?)' };
  let items, ext;
  try{
    items = await extraireItemsPdf(fileOrBlob);
    ext = analyserBulletinPdf(items);
  } catch(e){
    console.error('Extraction PDF échouée', salaireRow.id, e);
    return { ok:false, reason:'lecture du PDF impossible : ' + e.message };
  }

  const updates = {};
  if(salaireRow.brut==null && ext.brut!=null) updates.brut = ext.brut;
  if(salaireRow.net_paye==null && ext.netPaye!=null) updates.net_paye = ext.netPaye;
  if(salaireRow.charges_patronales==null && ext.chargesPatronales!=null) updates.charges_patronales = ext.chargesPatronales;
  if(salaireRow.cout_global==null && ext.coutGlobal!=null) updates.cout_global = ext.coutGlobal;
  if(salaireRow.conges_n_1==null && ext.congesN1!=null) updates.conges_n_1 = ext.congesN1;
  if(salaireRow.conges_n==null && ext.congesN!=null) updates.conges_n = ext.congesN;
  if(salaireRow.titres_restaurant==null && ext.titresRestaurant!=null) updates.titres_restaurant = ext.titresRestaurant;

  if(Object.keys(updates).length===0){
    return { ok:true, reason: ext.typeDocument ? 'rien de nouveau à écrire (déjà rempli, ou aucune donnée reconnue dans ce PDF)' : 'ce PDF ne ressemble pas au modèle de bulletin attendu (en-tête « ##BULLETIN## » introuvable)' };
  }

  const { error: updErr } = await sb.from('salaires').update(updates).eq('id', salaireRow.id);
  if(updErr){
    console.error('Echec écriture salaires', salaireRow.id, updErr);
    return { ok:false, reason:'écriture refusée par Supabase : ' + updErr.message };
  }

  const collab = STATE.collaborateurs.find(c=>c.id===collaborateurId);
  const collabUpdates = {};
  if(collab && !collab.niveau && ext.niveau) collabUpdates.niveau = ext.niveau;
  if(collab && !collab.matricule && ext.matricule) collabUpdates.matricule = ext.matricule;
  if(collab && !collab.date_entree && ext.dateEntree) collabUpdates.date_entree = ext.dateEntree;
  if(Object.keys(collabUpdates).length>0){
    const { error: collabErr } = await sb.from('collaborateurs').update(collabUpdates).eq('id', collaborateurId);
    if(collabErr) console.error('Echec écriture collaborateurs (niveau/matricule/date_entree)', collaborateurId, collabErr);
  }
  return { ok:true, reason:'champs mis à jour : ' + Object.keys(updates).join(', ') };
}

async function scannerTousLesBulletins(){
  const statusEl = document.getElementById('scan-bulletins-status');
  const btn = document.getElementById('scan-bulletins-btn');
  statusEl.textContent = 'Recherche des documents à traiter...';
  // Retraite tout ce qui n'a pas encore été validé manuellement (statut 'a_verifier'), pas
  // seulement ce qui n'a jamais été scanné — permet de corriger une extraction automatique
  // erronée sans jamais toucher à une ligne que vous avez vérifiée/modifiée vous-même.
  const { data: rows, error: selErr } = await sb.from('salaires')
    .select('*, imports:document_id(chemin_storage)')
    .eq('statut', 'a_verifier');
  if(selErr){ statusEl.textContent = 'Erreur de lecture Supabase : ' + selErr.message; return; }

  const sansDocument = (rows||[]).filter(r=>!r.imports?.chemin_storage).length;
  const aTraiter = (rows||[]).filter(r=>r.imports?.chemin_storage);
  if(aTraiter.length===0){
    statusEl.textContent = sansDocument>0
      ? `${sansDocument} ligne(s) sans document attaché, rien à scanner. Attachez d'abord le PDF.`
      : 'Rien à extraire — tous les documents ont déjà leurs chiffres, ou ont été validés manuellement.';
    return;
  }

  btn.disabled = true;
  let done = 0, ok = 0;
  const raisons = {};
  for(const r of aTraiter){
    statusEl.textContent = `Extraction en cours... ${done+1}/${aTraiter.length}`;
    const { data: blob, error } = await sb.storage.from('bulletins-salaire').download(r.imports.chemin_storage);
    let resultat;
    if(error){
      resultat = { ok:false, reason:'téléchargement du fichier impossible : ' + error.message };
    } else {
      // Réinitialise les champs extraits automatiquement avant de relancer l'extraction,
      // pour que la correction du parseur s'applique aussi aux documents déjà scannés.
      const rowAReextraire = { ...r, brut:null, charges_patronales:null, cout_global:null,
        conges_n_1:null, conges_n:null, titres_restaurant:null };
      resultat = await appliquerExtractionSurSalaire(rowAReextraire, r.collaborateur_id, blob);
    }
    if(resultat.ok) ok++;
    raisons[resultat.reason] = (raisons[resultat.reason]||0) + 1;
    done++;
  }
  const detail = Object.entries(raisons).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([raison,n])=>`${n}× ${raison}`).join(' · ');
  statusEl.innerHTML = `Terminé : ${ok}/${aTraiter.length} document(s) traité(s).<br><span style="font-size:11.5px;">${detail}</span>`;
  btn.disabled = false;
  await loadReferenceData();
  loadRecapSalaires();
  loadSalairesLibrary();
}

// Logique d'envoi partagée entre l'ajout unitaire et l'import groupé
async function uploadBulletin(collaborateurId, mois, typeDocument, file){
  const exercice = findExerciceForDate(`${mois}-01`);
  if(!exercice) return { ok:false, message:`Aucun exercice comptable ne couvre ${mois}.` };

  const collaborateur = STATE.collaborateurs.find(c=>c.id===collaborateurId);
  const { data: existant } = await sb.from('salaires')
    .select('*')
    .eq('collaborateur_id', collaborateurId)
    .eq('mois', mois)
    .eq('type_document', typeDocument)
    .maybeSingle();

  let importId = existant?.document_id;
  if(importId){
    await sb.from('imports').update({ nom_fichier: file.name }).eq('id', importId);
  } else {
    const { data: importRow, error: importErr } = await sb.from('imports').insert({
      exercice_id: exercice.id, type_import: 'salaire', mois, nom_fichier: file.name, statut: 'importé'
    }).select().single();
    if(importErr) return { ok:false, message: importErr.message };
    importId = importRow.id;
  }

  const path = `${collaborateurId}/${mois}_${typeDocument}_${Date.now()}_${sanitizeFilename(file.name)}`;
  const { error: uploadErr } = await sb.storage.from('bulletins-salaire').upload(path, file, { upsert:true });
  if(uploadErr) return { ok:false, message: uploadErr.message };
  await sb.from('imports').update({ chemin_storage: path }).eq('id', importId);

  let salaireRow = existant;
  if(existant){
    await sb.from('salaires').update({ document_id: importId }).eq('id', existant.id);
  } else {
    const { data: inserted, error: salErr } = await sb.from('salaires').insert({
      exercice_id: exercice.id,
      collaborateur_id: collaborateurId,
      mois,
      type_document: typeDocument,
      affectation: collaborateur?.affectation || null,
      document_id: importId,
      statut: 'a_verifier'
    }).select().single();
    if(salErr) return { ok:false, message: salErr.message };
    salaireRow = inserted;
  }

  if(/\.pdf$/i.test(file.name)){
    await appliquerExtractionSurSalaire(salaireRow, collaborateurId, file);
  }
  return { ok:true };
}

async function handleSalaireFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('salaire-import-status');
  const moisInput = document.getElementById('salaire-mois-input');
  const typeSelect = document.getElementById('salaire-type-select');
  const mois = moisInput.value;
  const typeDocument = typeSelect.value;
  const resetInput = () => { e.target.value = ''; };

  if(!mois){
    statusEl.innerHTML = `<div class="error-msg">Choisissez d'abord le mois concerné par ce document.</div>`;
    resetInput();
    return;
  }
  if(!/\.pdf$/i.test(file.name)){
    statusEl.innerHTML = `<div class="error-msg">« ${file.name} » n'est pas un PDF — c'est le seul format accepté ici.</div>`;
    resetInput();
    return;
  }

  const res = await uploadBulletin(SALARIE_SELECTED_ID, mois, typeDocument, file);

  loadSalairesLibrary();

async function runBulkImport(){
  const btn = document.getElementById('bulk-import-btn');
  const progress = document.getElementById('bulk-import-progress');
  const rows = BULK_ROWS.filter(r=>r.collaborateurId && r.mois);
  const skipped = BULK_ROWS.length - rows.length;
  if(rows.length===0){ progress.textContent = 'Aucune ligne complète à importer.'; return; }
  btn.disabled = true;
  let done = 0, erreurs = 0;
  for(const r of rows){
    progress.textContent = `Import en cours... ${done+1}/${rows.length}`;
    const res = await uploadBulletin(r.collaborateurId, r.mois, r.typeDocument, r.file);
    if(!res.ok) erreurs++;
    done++;
  }
  progress.textContent = `Terminé : ${done-erreurs}/${rows.length} importé(s)${erreurs?`, ${erreurs} erreur(s)`:''}${skipped?`, ${skipped} ligne(s) ignorée(s) (salarié ou mois manquant)`:''}.`;
  btn.disabled = false;
  BULK_ROWS = [];
  loadSalairesLibrary();
}

async function loadSalairesLibrary(){
  const container = document.getElementById('salaires-groups');
  if(!SALARIE_SELECTED_ID){ container.innerHTML = `<div class="empty">Sélectionnez un salarié.</div>`; return; }

  const { data: salaires } = await sb.from('salaires')
    .select('*, imports:document_id(*)')
    .eq('collaborateur_id', SALARIE_SELECTED_ID)
    .order('mois', {ascending:false});

  if(!salaires || salaires.length===0){
    container.innerHTML = `<div class="empty">Aucun document déposé pour ce salarié.</div>`;
    return;
  }

  const groups = {};
  salaires.forEach(s=>{
    const annee = s.mois ? s.mois.slice(0,4) : 'Sans date';
    if(!groups[annee]) groups[annee] = [];
    groups[annee].push(s);
  });
  const annees = Object.keys(groups).sort().reverse();
  if(OPEN_ANNEES_SALAIRES.size===0 && annees.length>0) OPEN_ANNEES_SALAIRES.add(annees[0]);

  container.innerHTML = annees.map(annee=>{
    const liste = groups[annee];

      </button>

          <thead><tr><th>Mois</th><th>Type</th><th>Nom du fichier</th><th>Document original</th><th>Chiffres</th></tr></thead>
          <tbody>

                   <label class="btn secondary small" style="margin-left:6px;cursor:pointer;">Remplacer<input type="file" class="doc-input-sal" accept=".pdf" hidden></label>`

                </tr>

                  <td colspan="5" style="background:var(--bg);">
                    <div style="display:flex;flex-wrap:wrap;gap:10px;padding:14px 4px;">
                      ${champ('brut','Brut','0.01')}
                      ${champ('net_paye','Net payé','0.01')}
                      ${champ('charges_patronales','Charges patronales','0.01')}
                      ${champ('cout_global','Coût employeur','0.01')}

      const detailRow = btn.closest('tr');
      const updates = { statut: 'valide_manuel' };
      detailRow.querySelectorAll('.detail-input').forEach(inp=>{
        const c = inp.dataset.champ;
        updates[c] = c==='maladie_arret' ? (inp.value.trim() || null) : (inp.value===''? null : Number(inp.value));
      });
      const { error } = await sb.from('salaires').update(updates).eq('id', btn.dataset.salaireId);
      if(error){ toast('Erreur : ' + error.message); return; }
      toast('Chiffres enregistrés ✔');
      loadRecapSalaires();
      loadSalairesLibrary();
    });
  });
}

  if(CONTROLE_ANNEES.size===0) CONTROLE_ANNEES.add(new Date().getFullYear());

  });

  function majBoutonTri(){
    document.getElementById('tri-dir-btn').textContent = CONTROLE_TRI_DIR==='asc' ? '⬆️ Croissant' : '⬇️ Décroissant';
  }

    majBoutonTri();

  document.getElementById('valider-selection-btn').addEventListener('click', validerSelection);
  document.getElementById('marquer-selection-non-requis-btn').addEventListener('click', marquerSelectionNonRequis);

  anneesRow.innerHTML = anneesDisponibles().map(a=>`<button class="pill-toggle" data-annee="${a}">${a}</button>`).join('');
  anneesRow.querySelectorAll('.pill-toggle').forEach(b=>{
    const annee = Number(b.dataset.annee);
    b.classList.toggle('active', CONTROLE_ANNEES.has(annee));
    b.addEventListener('click', ()=>{
      if(CONTROLE_ANNEES.has(annee)) CONTROLE_ANNEES.delete(annee); else CONTROLE_ANNEES.add(annee);
      b.classList.toggle('active');
      loadControleRows();
    });
  });

  loadControleRows();
}

async function validerToutesReconnues(){
  const { data } = await sb.from('operations_bancaires')
    .select('id, categorie_proposee_id, affectation')
    .eq('etat', 'reconnu_auto');
  if(!data || data.length===0){ toast('Aucune opération reconnue à valider.'); return; }
  if(!confirm(`Valider automatiquement les ${data.length} opérations reconnues (catégorie déjà proposée), toutes années confondues ?`)) return;
  await Promise.all(data.map(op=>
    sb.from('operations_bancaires').update({
      categorie_finale_id: op.categorie_proposee_id,
      affectation: op.affectation || 'COMMUN',
      etat: 'valide_manuel',
      valide_manuellement: true
    }).eq('id', op.id)
  ));
  toast(`${data.length} opérations validées ✔`);
  loadControleRows();
}

  let justifCell;
  if(!op.debit){
    justifCell = `<span style="color:var(--muted);font-size:12.5px;">— (recette)</span>`;
  } else if(op.justificatif_non_requis){
    justifCell = `<span class="badge green">Non requis</span>
      <button class="btn secondary small annuler-non-requis-btn" style="margin-left:6px;">Annuler</button>`;

    <td><input type="checkbox" class="row-check" data-id="${op.id}"></td>
    <td>${fmtDate(op.date_operation)}</td>

      <select class="row-select cat-select">
        <option value="">—</option>

function wireRowEvents(tr){
  tr.querySelector('.valider-btn').addEventListener('click', ()=>validerOperation(tr));
  const justifInput = tr.querySelector('.justif-input');
  if(justifInput) justifInput.addEventListener('change', (e)=>handleJustificatifUpload(tr, e.target.files[0]));
  const voirLink = tr.querySelector('.voir-justif-link');
  if(voirLink) voirLink.addEventListener('click', (e)=>{ e.preventDefault(); voirJustificatif(tr.dataset.path); });
  const marquerBtn = tr.querySelector('.marquer-non-requis-btn');
  if(marquerBtn) marquerBtn.addEventListener('click', ()=>setJustificatifNonRequis(tr.dataset.id, true));
  const annulerBtn = tr.querySelector('.annuler-non-requis-btn');
  if(annulerBtn) annulerBtn.addEventListener('click', ()=>setJustificatifNonRequis(tr.dataset.id, false));
}

async function fetchToutesLesLignes(buildQuery){
  const PAGE = 1000;
  let from = 0;
  let toutes = [];
  while(true){
    const { data, error } = await buildQuery().range(from, from + PAGE - 1);
    if(error){ console.error('Erreur pagination :', error); break; }
    if(!data || data.length===0) break;
    toutes = toutes.concat(data);
    if(data.length < PAGE) break;
    from += PAGE;
  }
  return toutes;
}

async function loadControleRows(){
  let rangeStart = null, rangeEnd = null;
  if(CONTROLE_ANNEES.size>0){
    const anneesArr = Array.from(CONTROLE_ANNEES);
    rangeStart = `${Math.min(...anneesArr)}-01-01`;
    rangeEnd = `${Math.max(...anneesArr)}-12-31T23:59:59`;
  }
  let data = await fetchToutesLesLignes(()=>{
    let q = sb.from('operations_bancaires').select('*').order('date_operation',{ascending:false});
    if(CONTROLE_FILTER!=='toutes') q = q.eq('etat', CONTROLE_FILTER);
    if(SANS_JUSTIFICATIF_ONLY){ q = q.not('debit','is', null).is('piece_jointe_path', null).eq('justificatif_non_requis', false); }
    if(rangeStart) q = q.gte('date_operation', rangeStart).lte('date_operation', rangeEnd);
    return q;
  });
  const container = document.getElementById('controle-groups');
  if(!data || data.length===0){ container.innerHTML = `<div class="empty">Aucune opération.</div>`; return; }

  // Tri (à l'intérieur de chaque mois, les mois eux-mêmes restent du plus récent au plus ancien)
  const categoryMap = new Map(STATE.categories.map(c=>[c.id, c.libelle]));
  const etatOrdre = {a_categoriser:0, a_verifier:1, reconnu_auto:2, valide_manuel:3};
  data.sort((a,b)=>{
    let va, vb;
    if(CONTROLE_TRI_CHAMP==='libelle'){ va=(a.libelle||'').toLowerCase(); vb=(b.libelle||'').toLowerCase(); }
    else if(CONTROLE_TRI_CHAMP==='categorie'){
      va=(categoryMap.get(a.categorie_finale_id||a.categorie_proposee_id)||'').toLowerCase();
      vb=(categoryMap.get(b.categorie_finale_id||b.categorie_proposee_id)||'').toLowerCase();
    }
    else if(CONTROLE_TRI_CHAMP==='montant'){ va=Number(a.debit||a.credit||0); vb=Number(b.debit||b.credit||0); }
    else if(CONTROLE_TRI_CHAMP==='etat'){ va=etatOrdre[a.etat]??0; vb=etatOrdre[b.etat]??0; }
    else { va=a.date_operation; vb=b.date_operation; }
    let cmp = (typeof va==='string') ? va.localeCompare(vb) : va-vb;
    return CONTROLE_TRI_DIR==='asc' ? cmp : -cmp;
  });

  // Filtre par année (pastilles) — sécurité en plus du filtre serveur (années non contiguës)
  if(CONTROLE_ANNEES.size>0){
    data = data.filter(op => CONTROLE_ANNEES.has(new Date(op.date_operation).getFullYear()));
  }

  // Regroupement par mois/année
  const groups = {};
  data.forEach(op=>{
    const d = new Date(op.date_operation);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!groups[key]) groups[key] = { label: d.toLocaleDateString('fr-FR',{month:'long', year:'numeric'}), rows: [] };
    groups[key].rows.push(op);
  });
  const keys = Object.keys(groups).sort().reverse();
  // Tous les mois sont repliés par défaut (l'utilisateur ouvre lui-même ce qu'il veut voir)

  container.innerHTML = keys.map(key=>{
    const g = groups[key];
    const isOpen = OPEN_MOIS.has(key);
    const label = g.label.charAt(0).toUpperCase() + g.label.slice(1);
    return `
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 18px;">
        <input type="checkbox" class="select-all-mois" data-mois="${key}" title="Tout sélectionner ce mois">
        <button class="mois-toggle" data-mois="${key}" style="flex:1;text-align:left;background:none;border:none;font-weight:700;font-size:14px;cursor:pointer;color:var(--text);display:flex;justify-content:space-between;align-items:center;padding:0;">
          <span>${label}</span>
          <span style="font-weight:600;color:var(--muted);font-size:12.5px;">${g.rows.length} opération(s) <span class="chevron">${isOpen?'▲':'▼'}</span></span>
        </button>
      </div>
      <div class="mois-content" data-mois-content="${key}" style="display:${isOpen?'block':'none'};border-top:1px solid var(--border);">
        <div class="hscroll-top" data-hscroll-top="${key}"><div class="hscroll-top-inner" data-hscroll-inner="${key}"></div></div>
        <div class="hscroll-body" data-hscroll-body="${key}">
          <table style="width:auto;min-width:1100px;">
            <thead><tr>
              <th></th><th>Date</th><th>Libellé</th><th>Débit</th><th>Crédit</th>
              <th>Catégorie</th><th>Affectation</th><th>État</th><th>Justificatif</th><th></th>
            </tr></thead>
            <tbody>${g.rows.map(buildRowHtml).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');

  // Barre de défilement horizontale fixée sous l'en-tête, synchronisée avec le tableau
  function majLargeurHscroll(key){
    const bodyEl = container.querySelector(`[data-hscroll-body="${key}"]`);
    const innerEl = container.querySelector(`[data-hscroll-inner="${key}"]`);
    if(!bodyEl || !innerEl) return;
    const table = bodyEl.querySelector('table');
    innerEl.style.width = table.scrollWidth + 'px';
  }
  container.querySelectorAll('[data-hscroll-body]').forEach(bodyEl=>{
    const key = bodyEl.dataset.hscrollBody;
    const topEl = container.querySelector(`[data-hscroll-top="${key}"]`);
    if(OPEN_MOIS.has(key)) majLargeurHscroll(key);
    let sync = false;
    topEl.addEventListener('scroll', ()=>{ if(sync) return; sync=true; bodyEl.scrollLeft = topEl.scrollLeft; sync=false; });
    bodyEl.addEventListener('scroll', ()=>{ if(sync) return; sync=true; topEl.scrollLeft = bodyEl.scrollLeft; sync=false; });
  });

  container.querySelectorAll('.mois-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.mois;
      const el = container.querySelector(`.mois-content[data-mois-content="${key}"]`);
      const willOpen = el.style.display === 'none';
      el.style.display = willOpen ? 'block' : 'none';
      if(willOpen){ OPEN_MOIS.add(key); majLargeurHscroll(key); } else OPEN_MOIS.delete(key);
      btn.querySelector('.chevron').textContent = willOpen ? '▲' : '▼';
    });
  });
  container.querySelectorAll('.select-all-mois').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = cb.dataset.mois;
      container.querySelectorAll(`.mois-content[data-mois-content="${key}"] .row-check`).forEach(rc=>rc.checked = cb.checked);
      updateSelectionCount();
    });
  });
  container.querySelectorAll('.row-check').forEach(cb=>cb.addEventListener('change', updateSelectionCount));
  container.querySelectorAll('tr[data-id]').forEach(tr=>wireRowEvents(tr));
  updateSelectionCount();
}

async function setJustificatifNonRequis(id, value){
  const { error } = await sb.from('operations_bancaires').update({ justificatif_non_requis: value }).eq('id', id);
  if(error){ toast('Erreur : ' + error.message); return; }
  toast(value ? 'Marquée « sans justificatif » ✔' : 'Justificatif de nouveau requis');
  loadControleRows();
}

async function handleJustificatifUpload(tr, file){
  if(!file) return;
  const id = tr.dataset.id;
  const cleanName = sanitizeFilename(file.name);
  const path = `${STATE.currentExercice.id}/${id}/${Date.now()}_${cleanName}`;
  toast('Envoi du fichier...');
  const { error: uploadErr } = await sb.storage.from('justificatifs').upload(path, file, { upsert:true });
  if(uploadErr){
    console.error('Erreur upload justificatif :', uploadErr);
    alert('Erreur lors de l\'envoi du fichier :\n' + uploadErr.message + '\n\nVérifiez que le bucket "justificatifs" existe bien dans Supabase > Storage.');
    return;
  }

  const { error: updateErr } = await sb.from('operations_bancaires').update({
    piece_jointe_path: path,
    piece_jointe_nom: file.name,
    piece_jointe_ajoutee_le: new Date().toISOString()
  }).eq('id', id);
  if(updateErr){
    console.error('Erreur enregistrement justificatif :', updateErr);
    alert('Le fichier a été envoyé mais l\'enregistrement a échoué :\n' + updateErr.message);
    return;
  }

  toast('Justificatif ajouté ✔');
  loadControleRows();
}

function sanitizeFilename(name){
  return name
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9.\-_]/g, '_');
}

async function voirJustificatif(path){
  if(!path) return;
  const { data, error } = await sb.storage.from('justificatifs').createSignedUrl(path, 60);
  if(error){ toast('Impossible d\'ouvrir le fichier : ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

let REGLES_CACHE = { regles: [], categories: [] };

async function loadReglesAdmin(){
  const [{ data: regles }, { data: toutesCategories }] = await Promise.all([
    sb.from('regles_categorisation').select('*').order('mot_cle'),
    sb.from('categories').select('*').order('libelle')
  ]);
  REGLES_CACHE.regles = regles || [];
  REGLES_CACHE.categories = toutesCategories || [];

  const searchInput = document.getElementById('regle-search');
  if(searchInput && !searchInput.dataset.wired){
    searchInput.dataset.wired = '1';
    searchInput.addEventListener('input', ()=> renderReglesTable(searchInput.value));
  }
  renderReglesTable(searchInput ? searchInput.value : '');
}

function renderReglesTable(recherche){
  const { regles, categories } = REGLES_CACHE;
  const tbody = document.getElementById('regle-tbody');
  if(!regles || regles.length===0){ tbody.innerHTML = `<tr><td colspan="6" class="empty">Aucune règle.</td></tr>`; return; }

  const terme = (recherche||'').trim().toLowerCase();
  const catMap = new Map(categories.map(c=>[c.id, c.libelle]));
  let filtres = regles;
  if(terme){
    filtres = regles.filter(r => (r.mot_cle||'').toLowerCase().includes(terme));
  }
  if(filtres.length===0){ tbody.innerHTML = `<tr><td colspan="6" class="empty">Aucun mot-clé ne correspond à "${recherche}".</td></tr>`; return; }

  const sorted = [...filtres].sort((a,b)=>{
    const ca = catMap.get(a.categorie_id) || '';
    const cb = catMap.get(b.categorie_id) || '';
    return ca.localeCompare(cb) || a.mot_cle.localeCompare(b.mot_cle);
  });

  tbody.innerHTML = sorted.map(r=>`
    <tr data-id="${r.id}">
      <td><input type="text" class="rename-regle-input" value="${(r.mot_cle||'').replace(/"/g,'&quot;')}" style="width:100%;max-width:180px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px;"></td>
      <td>
        <select class="regle-categorie-select row-select">
          ${categories.map(c=>`<option value="${c.id}" ${c.id===r.categorie_id?'selected':''}>${c.libelle}</option>`).join('')}
        </select>
      </td>
      <td>
        <select class="regle-affectation-select row-select">
          ${affectationsDisponibles().map(a=>`<option value="${a}" ${a===r.affectation?'selected':''}>${a}</option>`).join('')}
        </select>
      </td>
      <td>${r.confiance}%</td>
      <td><span class="badge ${r.actif?'green':'red'}">${r.actif?'Active':'Désactivée'}</span></td>
      <td>
        <button class="btn secondary small toggle-regle-btn">${r.actif?'Désactiver':'Réactiver'}</button>
        ${!r.actif ? `<button class="btn secondary small supprimer-regle-btn" style="margin-left:6px;color:#c22b2b;">🗑️</button>` : ''}
      </td>
    </tr>`).join('');

  tbody.querySelectorAll('tr').forEach(tr=>{
    const id = tr.dataset.id;
    tr.querySelector('.rename-regle-input').addEventListener('change', async (e)=>{
      const v = e.target.value.trim();
      if(!v) return;
      const { error } = await sb.from('regles_categorisation').update({ mot_cle: v }).eq('id', id);
      if(error){ toast('Erreur : ' + error.message); return; }
      toast('Mot-clé renommé ✔');
    });
    tr.querySelector('.regle-categorie-select').addEventListener('change', async (e)=>{
      const { error } = await sb.from('regles_categorisation').update({ categorie_id: e.target.value }).eq('id', id);
      if(error){ toast('Erreur : ' + error.message); return; }
      toast('Catégorie mise à jour ✔');
    });
    tr.querySelector('.regle-affectation-select').addEventListener('change', async (e)=>{
      const { error } = await sb.from('regles_categorisation').update({ affectation: e.target.value }).eq('id', id);
      if(error){ toast('Erreur : ' + error.message); return; }
      toast('Affectation mise à jour ✔');
    });
    tr.querySelector('.toggle-regle-btn').addEventListener('click', async ()=>{
      const { data: current } = await sb.from('regles_categorisation').select('actif').eq('id', id).single();
      const { error } = await sb.from('regles_categorisation').update({ actif: !current.actif }).eq('id', id);
      if(error){ toast('Erreur : ' + error.message); return; }
      loadReglesAdmin();
    });
    const supprimerBtn = tr.querySelector('.supprimer-regle-btn');
    if(supprimerBtn){
      supprimerBtn.addEventListener('click', async ()=>{
        if(!confirm('Supprimer définitivement ce mot-clé ?')) return;
        const { error } = await sb.from('regles_categorisation').delete().eq('id', id);
        if(error){ toast('Suppression impossible : ' + error.message); return; }
        toast('Mot-clé supprimé ✔');
        loadReglesAdmin();
      });
    }
  });
}

async function reappliquerReglesNonValidees(){
  if(!confirm(`Relire toutes les opérations non validées avec les règles actuelles, toutes années confondues ?`)) return;

  const { data: regles } = await sb.from('regles_categorisation').select('*').eq('actif', true).order('priorite');
  if(!regles || regles.length===0){ toast('Aucune règle active.'); return; }

  const operations = await fetchToutesLesLignes(()=>
    sb.from('operations_bancaires').select('id, libelle, etat')
      .neq('etat', 'valide_manuel')
  );
  if(!operations || operations.length===0){ toast('Aucune opération à relire.'); return; }

  function trouverRegle(libelle){
    const low = (libelle||'').toLowerCase();
    for(const r of regles){
      if(low.includes(r.mot_cle.toLowerCase())) return r;
    }
    return null;
  }

  let miseAJour = 0;
  await Promise.all(operations.map(async (op)=>{
    const match = trouverRegle(op.libelle);
    if(!match) return;
    const nouvelEtat = match.validation_auto ? 'valide_manuel' : (match.confiance >= 95 ? 'reconnu_auto' : 'a_verifier');
    if(nouvelEtat === op.etat) return; // rien de neuf pour cette ligne
    const payload = {
      categorie_proposee_id: match.categorie_id,
      affectation: match.affectation || 'COMMUN',
      mot_cle_reconnu: match.mot_cle,
      confiance: match.confiance,
      etat: nouvelEtat
    };
    if(match.validation_auto){
      payload.categorie_finale_id = match.categorie_id;
      payload.valide_manuellement = true;
    }
    const { error } = await sb.from('operations_bancaires').update(payload).eq('id', op.id);
    if(!error) miseAJour++;
  }));

  toast(`${miseAJour} opération(s) mise(s) à jour avec les règles actuelles ✔`);
}

async function genererReglesManquantes(){
  const { data: reglesActives } = await sb.from('regles_categorisation').select('mot_cle').eq('actif', true);
  const regles = reglesActives || [];
  function dejaCouverte(libelle){
    const low = (libelle||'').toLowerCase();
    return regles.some(r => low.includes(r.mot_cle.toLowerCase()));
  }

  const operations = await fetchToutesLesLignes(()=>
    sb.from('operations_bancaires').select('libelle, categorie_finale_id, affectation')
      .eq('etat', 'valide_manuel')
      .not('categorie_finale_id', 'is', null)
  );
  if(!operations || operations.length===0){ toast('Aucune opération validée à analyser.'); return; }

  const candidats = new Map();
  operations.forEach(op=>{
    if(dejaCouverte(op.libelle)) return;
    const motCle = suggestKeyword(op.libelle);
    if(!motCle || motCle.length<3) return;
    const affectation = op.affectation || 'COMMUN';
    const cle = motCle.toLowerCase()+'|'+op.categorie_finale_id+'|'+affectation;
    if(!candidats.has(cle)) candidats.set(cle, { mot_cle: motCle, categorie_id: op.categorie_finale_id, affectation });
  });

  if(candidats.size===0){ toast('Rien à générer : toutes les opérations validées sont déjà couvertes par une règle.'); return; }

  const liste = Array.from(candidats.values());
  const apercu = liste.slice(0,8).map(r=>`"${r.mot_cle}"`).join(', ');
  const confirmer = confirm(`${liste.length} règle(s) manquante(s) détectée(s) parmi vos opérations déjà validées.\n\nEx : ${apercu}${liste.length>8?'…':''}\n\nLes créer maintenant ?`);
  if(!confirmer) return;

  let creees = 0, echecs = 0;
  await Promise.all(liste.map(async (r)=>{
    const { error } = await sb.from('regles_categorisation').insert({
      mot_cle: r.mot_cle, categorie_id: r.categorie_id, affectation: r.affectation,
      priorite: 1, confiance: 100, validation_auto: true,
      commentaire: 'Générée depuis les opérations déjà validées'
    });
    if(error){ echecs++; console.error('Erreur création règle :', r.mot_cle, error); } else { creees++; }
  }));
  toast(echecs>0 ? `${creees} règle(s) créée(s), ${echecs} échec(s) (voir la console) ⚠️` : `${creees} règle(s) créée(s) ✔`);
  loadReglesAdmin();
}

async function afficherLignesLieesCategorie(categorieId, tr, toutesCategories){
  // Retirer un éventuel panneau déjà ouvert pour cette ligne
  const existant = document.querySelector(`tr.panneau-liaison[data-pour="${categorieId}"]`);
  if(existant){ existant.remove(); return; }

  const [{ data: ops }, { data: regles }] = await Promise.all([
    sb.from('operations_bancaires')
      .select('id, date_operation, libelle, debit, credit')
      .or(`categorie_finale_id.eq.${categorieId},categorie_proposee_id.eq.${categorieId}`)
      .order('date_operation', {ascending:false})
      .limit(200),
    sb.from('regles_categorisation')
      .select('id, mot_cle')
      .eq('categorie_id', categorieId)
  ]);

  const autresCategories = toutesCategories.filter(c=>c.id!==categorieId && c.actif);
  const nbOps = (ops||[]).length, nbRegles = (regles||[]).length;

  const panneau = document.createElement('tr');
  panneau.className = 'panneau-liaison';
  panneau.dataset.pour = categorieId;
  panneau.innerHTML = `
    <td colspan="3" style="background:#fbfcfe;padding:16px 20px;">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">
        Impossible de supprimer : ${nbOps} opération(s) bancaire(s) et ${nbRegles} règle(s) utilisent encore cette catégorie.
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
        <label style="font-size:13px;color:var(--muted);">Réaffecter tout vers</label>
        <select id="reaffecter-vers-select" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;">
          ${autresCategories.map(c=>`<option value="${c.id}">${c.libelle}</option>`).join('')}
        </select>
        <button class="btn small" id="reaffecter-supprimer-btn">Réaffecter puis supprimer</button>
      </div>
      ${nbOps>0 ? `
        <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;">Opérations bancaires concernées :</div>
        <div class="table-wrap" style="margin-bottom:12px;max-height:260px;overflow-y:auto;">
          <table>
            <thead><tr><th>Date</th><th>Libellé</th><th>Montant</th></tr></thead>
            <tbody>
              ${(ops||[]).map(o=>`<tr><td>${fmtDate(o.date_operation)}</td><td style="max-width:300px;white-space:normal;">${o.libelle}</td><td>${o.debit?fmtEUR(o.debit):(o.credit?fmtEUR(o.credit):'')}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}
      ${nbRegles>0 ? `
        <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;">Règles du dictionnaire concernées :</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Mot-clé</th></tr></thead>
            <tbody>${(regles||[]).map(r=>`<tr><td>${r.mot_cle}</td></tr>`).join('')}</tbody>
          </table>
        </div>` : ''}
      <div class="hint" style="margin-top:10px;">Vous pouvez aussi laisser cette catégorie désactivée sans la supprimer — elle n'apparaît déjà plus dans les listes de choix.</div>
    </td>
  `;
  tr.after(panneau);

  panneau.querySelector('#reaffecter-supprimer-btn').addEventListener('click', async ()=>{
    const nouvelleCategorieId = panneau.querySelector('#reaffecter-vers-select').value;
    if(!nouvelleCategorieId){ toast('Aucune autre catégorie disponible pour réaffecter.'); return; }
    if(!confirm(`Réaffecter ${nbOps} opération(s) et ${nbRegles} règle(s) vers cette catégorie, puis supprimer l'ancienne ?`)) return;

    await Promise.all([
      sb.from('operations_bancaires').update({ categorie_finale_id: nouvelleCategorieId }).eq('categorie_finale_id', categorieId),

  });

      loadMagasinsAdmin();
    });

  }
