function calculerAnciennete(dateEntree, dateSortie){
  if(!dateEntree) return '—';
  const debut = new Date(dateEntree+'T00:00:00');
  const fin = dateSortie ? new Date(dateSortie+'T00:00:00') : new Date();
  let mois = (fin.getFullYear()-debut.getFullYear())*12 + (fin.getMonth()-debut.getMonth());
  if(fin.getDate() < debut.getDate()) mois--;
  if(mois < 0) return '—';
  const ans = Math.floor(mois/12);
  const moisRestants = mois % 12;
  if(ans===0) return `${moisRestants} mois`;
  if(moisRestants===0) return `${ans} an${ans>1?'s':''}`;
  return `${ans} an${ans>1?'s':''} ${moisRestants} mois`;
}

/* ============================================================
   EXTRACTION AUTOMATIQUE DES BULLETINS PDF
   ============================================================ */
async function extraireItemsPdf(fileOrBlob){
  const buf = await fileOrBlob.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  let items = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    items = items.concat(content.items.map(it=>({ str: it.str, x: it.transform[4], y: it.transform[5] })));
  }
  return items;
}

// Reconstruit les nombres à partir d'une liste de chaînes (items pdf.js) : évite l'ambiguïté
// du séparateur de milliers français ("1" " " "975.16") vs deux nombres adjacents distincts.
function extraireNombresDepuisItems(arr){
  const nombres = [];
  for(let i=0;i<arr.length;i++){
    const it = arr[i];
    if(/^\d{1,3}$/.test(it) && arr[i+1]===' ' && /^\d{3}[.,]\d{2}$/.test(arr[i+2])){
      nombres.push(parseFloat((it+arr[i+2]).replace(',','.')));
      i += 2;
    } else if(/^-?\d+[.,]\d{2}$/.test(it)){
      nombres.push(parseFloat(it.replace(',','.')));
    }
  }
  return nombres;
}

// Le tableau "Congés N-1 / Congés N" (Acquis/Pris/Solde) est toujours en bas à gauche
// de la page, à un emplacement fixe du modèle — on le repère par coordonnées plutôt que
// par ordre du texte, pour distinguer sans ambiguïté quelle case précise est vide (= 0).
function extraireCongesDepuisItems(items){
  const labelAcquis = items.find(it=>it.str.trim()==='Acquis');
  const labelPris = items.find(it=>it.str.trim()==='Pris');
  const labelSolde = items.find(it=>it.str.trim()==='Solde');
  const labelColN1 = items.find(it=>it.str.trim()==='N-1');
  if(!labelAcquis || !labelPris || !labelSolde || !labelColN1) return null;

  const seuilColonne = labelColN1.x + 40;
  function valeurLigne(yCible){
    const candidats = items.filter(it =>
      Math.abs(it.y - yCible) < 3 && it.x < 200 && /^-?\d+[.,]\d{2}$/.test(it.str.trim())
    );
    const n1 = candidats.find(it => it.x < seuilColonne);
    const n = candidats.find(it => it.x >= seuilColonne);
    return {
      n1: n1 ? parseFloat(n1.str.replace(',','.')) : 0,
      n: n ? parseFloat(n.str.replace(',','.')) : 0,
    };
  }
  return { solde: valeurLigne(labelSolde.y) };
}

// Cherche le premier nombre qui suit un libellé donné (ex: "Titres-restaurant"),
// en tolérant que le libellé soit scindé en plusieurs items pdf.js.
function chercherValeurApresLibelle(items, regexLibelle){
  for(let i=0;i<items.length;i++){
    let assemble = '';
    let j = i;
    while(j<items.length && assemble.length<60){
      assemble += items[j].str;
      j++;
      if(regexLibelle.test(assemble)) break;
    }
    if(regexLibelle.test(assemble)){
      const suite = items.slice(j, j+8).map(it=>it.str);
      const nombres = extraireNombresDepuisItems(suite);
      if(nombres.length>0) return nombres[0];
    }
  }
  return null;
}

// Calé sur le modèle de bulletin GEM.VAP (ligne d'en-tête "##BULLETIN##MM-YYYY##...",
// tableau récap Mensuel/Annuel en fin de document). Renvoie null pour tout champ non
// reconnu avec certitude — jamais de valeur devinée au hasard (sauf congés : case vide = 0,
// confirmé par vérification manuelle de plusieurs bulletins).
function analyserBulletinPdf(items){
  const rawItems = items.map(it=>it.str);
  const texte = rawItems.join(' ').replace(/\s+/g,' ').trim();
  const res = { typeDocument:null, mois:null, matricule:null, nom:null, niveau:null,
    statutPro:null, dateEntree:null, brut:null, netPaye:null, chargesPatronales:null, coutGlobal:null,
    congesN1:null, congesN:null, titresRestaurant:null };

  const mHeader = texte.match(/##(BULLETIN|SOLDECPT)##(\d{2})-(\d{4})##(\d+)##([^#]+)##([^#]+)##(\d+)/);
  if(mHeader){
    res.typeDocument = mHeader[1]==='SOLDECPT' ? 'solde_tout_compte' : 'bulletin';
    res.mois = `${mHeader[3]}-${mHeader[2]}`;
    res.matricule = mHeader[4];
    res.nom = `${mHeader[5]} ${mHeader[6]}`;
  }

  const mStatut = texte.match(/(Cadre|Employé|Employée|Apprenti|Ouvrier|Agent de maîtrise)\s+(\S+)\s+(\d{2})\/(\d{2})\/(\d{4})/);
  if(mStatut){
    res.statutPro = mStatut[1];
    res.niveau = mStatut[2];
    res.dateEntree = `${mStatut[5]}-${mStatut[4]}-${mStatut[3]}`;
  }

  // Ligne "Salaire brut X" juste avant "Santé" : source indépendante du tableau récap,
  // fiable même quand la mise en page du tableau change (voir plus bas).
  const mBrut = texte.match(/Salaire brut\s+([\d\s.,]+?)\s+Santé/);
  if(mBrut) res.brut = parseFloat(mBrut[1].replace(/\s/g,'').replace(',','.'));

  const mNetSolde = texte.match(/somme nette de \**\s*([\d\s.,]+?)\s*Euros/i);
  if(mNetSolde) res.netPaye = parseFloat(mNetSolde[1].replace(/\s/g,'').replace(',','.'));

  const mNet = texte.match(/Net payé\s*:\s*([\d\s.,]+?)\s*euros/i);
  if(mNet) res.netPaye = parseFloat(mNet[1].replace(/\s/g,'').replace(',','.'));

  // Le tableau récap n'a la colonne "Heures suppl." que les mois avec heures supplémentaires :
  // sans détection dynamique, toutes les colonnes suivantes (Brut, Ch. patronales, Coût Global)
  // se décaleraient d'une case les mois sans heures sup — repéré en comparant deux vrais
  // bulletins d'un même salarié, l'un avec et l'autre sans heures supplémentaires.
  const zoneEntete = texte.slice(0, texte.indexOf('Mensuel') > -1 ? texte.indexOf('Mensuel') : 300);
  const aHeuresSuppl = /Heures\s+suppl\./.test(zoneEntete);
  const idxBrut = aHeuresSuppl ? 4 : 2;
  const idxChargesPatronales = aHeuresSuppl ? 10 : 8;
  const idxCoutGlobal = aHeuresSuppl ? 12 : 10;

  // Isole le segment entre l'avant-dernière et la dernière occurrence de "Net payé"
  // (le tableau récap Mensuel/Annuel s'y trouve toujours, juste avant la ligne finale)
  const idxNetPaye = [];
  for(let i=0;i<rawItems.length;i++){
    if(rawItems[i]==='Net' && rawItems[i+2]==='payé') idxNetPaye.push(i);
  }
  if(idxNetPaye.length>=2){
    const debut = idxNetPaye[idxNetPaye.length-2];
    const fin = idxNetPaye[idxNetPaye.length-1];
    const segment = rawItems.slice(debut, fin);
    const bloc = extraireNombresDepuisItems(segment).slice(1); // ignore la valeur du "Net payé" du corps
    if(res.brut==null && bloc.length>idxBrut) res.brut = bloc[idxBrut];
    if(bloc.length>idxCoutGlobal){
      res.chargesPatronales = bloc[idxChargesPatronales];
      res.coutGlobal = bloc[idxCoutGlobal];
    }
  }

  const conges = extraireCongesDepuisItems(items);
  if(conges){ res.congesN1 = conges.solde.n1; res.congesN = conges.solde.n; }

  const titres = chercherValeurApresLibelle(items, /Titres[\s-]*restaurant/i);
  if(titres!=null) res.titresRestaurant = titres;

  return res;
}

// Ne remplit que les champs actuellement vides — ne recouvre jamais une valeur déjà
// saisie ou déjà vérifiée manuellement. Renvoie toujours { ok, reason } — reason explique
// précisément ce qui s'est passé (utile pour diagnostiquer sans ouvrir la console).
async function attendrePdfjs(timeoutMs=8000){
  const debut = Date.now();
  while(!window.pdfjsLib){
    if(Date.now()-debut > timeoutMs) return false;
    await new Promise(r=>setTimeout(r, 150));
  }
  return true;
}

async function appliquerExtractionSurSalaire(salaireRow, collaborateurId, fileOrBlob){
  if(!(await attendrePdfjs())) return { ok:false, reason:'pdf.js non chargé après 8 secondes (bloqueur de script/pub ? pas de connexion internet ?)' };
  let items, ext;
  try{
    items = await extraireItemsPdf(fileOrBlob);
    ext = analyserBulletinPdf(items);
  } catch(e){
    console.error('Extraction PDF échouée', salaireRow.id, e);
    return { ok:false, reason:'lecture du PDF impossible : ' + e.message };
  }

  const updates = {};
  if(salaireRow.brut==null && ext.brut!=null) updates.brut = ext.brut;
  if(salaireRow.net_paye==null && ext.netPaye!=null) updates.net_paye = ext.netPaye;
  if(salaireRow.charges_patronales==null && ext.chargesPatronales!=null) updates.charges_patronales = ext.chargesPatronales;
  if(salaireRow.cout_global==null && ext.coutGlobal!=null) updates.cout_global = ext.coutGlobal;
  if(salaireRow.conges_n_1==null && ext.congesN1!=null) updates.conges_n_1 = ext.congesN1;
  if(salaireRow.conges_n==null && ext.congesN!=null) updates.conges_n = ext.congesN;
  if(salaireRow.titres_restaurant==null && ext.titresRestaurant!=null) updates.titres_restaurant = ext.titresRestaurant;

  if(Object.keys(updates).length===0){
    return { ok:true, reason: ext.typeDocument ? 'rien de nouveau à écrire (déjà rempli, ou aucune donnée reconnue dans ce PDF)' : 'ce PDF ne ressemble pas au modèle de bulletin attendu (en-tête « ##BULLETIN## » introuvable)' };
  }

  const { error: updErr } = await sb.from('salaires').update(updates).eq('id', salaireRow.id);
  if(updErr){
    console.error('Echec écriture salaires', salaireRow.id, updErr);
    return { ok:false, reason:'écriture refusée par Supabase : ' + updErr.message };
  }

  const collab = STATE.collaborateurs.find(c=>c.id===collaborateurId);
  const collabUpdates = {};
  if(collab && !collab.niveau && ext.niveau) collabUpdates.niveau = ext.niveau;
  if(collab && !collab.matricule && ext.matricule) collabUpdates.matricule = ext.matricule;
  if(collab && !collab.date_entree && ext.dateEntree) collabUpdates.date_entree = ext.dateEntree;
  if(Object.keys(collabUpdates).length>0){
    const { error: collabErr } = await sb.from('collaborateurs').update(collabUpdates).eq('id', collaborateurId);
    if(collabErr) console.error('Echec écriture collaborateurs (niveau/matricule/date_entree)', collaborateurId, collabErr);
  }
  return { ok:true, reason:'champs mis à jour : ' + Object.keys(updates).join(', ') };
}

async function scannerTousLesBulletins(){
  const statusEl = document.getElementById('scan-bulletins-status');
  const btn = document.getElementById('scan-bulletins-btn');
  statusEl.textContent = 'Recherche des documents à traiter...';
  // Retraite tout ce qui n'a pas encore été validé manuellement (statut 'a_verifier'), pas
  // seulement ce qui n'a jamais été scanné — permet de corriger une extraction automatique
  // erronée sans jamais toucher à une ligne que vous avez vérifiée/modifiée vous-même.
  const { data: rows, error: selErr } = await sb.from('salaires')
    .select('*, imports:document_id(chemin_storage)')
    .eq('statut', 'a_verifier');
  if(selErr){ statusEl.textContent = 'Erreur de lecture Supabase : ' + selErr.message; return; }

  const sansDocument = (rows||[]).filter(r=>!r.imports?.chemin_storage).length;
  const aTraiter = (rows||[]).filter(r=>r.imports?.chemin_storage);
  if(aTraiter.length===0){
    statusEl.textContent = sansDocument>0
      ? `${sansDocument} ligne(s) sans document attaché, rien à scanner. Attachez d'abord le PDF.`
      : 'Rien à extraire — tous les documents ont déjà leurs chiffres, ou ont été validés manuellement.';
    return;
  }

  btn.disabled = true;
  let done = 0, ok = 0;
  const raisons = {};
  for(const r of aTraiter){
    statusEl.textContent = `Extraction en cours... ${done+1}/${aTraiter.length}`;
    const { data: blob, error } = await sb.storage.from('bulletins-salaire').download(r.imports.chemin_storage);
    let resultat;
    if(error){
      resultat = { ok:false, reason:'téléchargement du fichier impossible : ' + error.message };
    } else {
      // Réinitialise les champs extraits automatiquement avant de relancer l'extraction,
      // pour que la correction du parseur s'applique aussi aux documents déjà scannés.
      const rowAReextraire = { ...r, brut:null, charges_patronales:null, cout_global:null,
        conges_n_1:null, conges_n:null, titres_restaurant:null };
      resultat = await appliquerExtractionSurSalaire(rowAReextraire, r.collaborateur_id, blob);
    }
    if(resultat.ok) ok++;
    raisons[resultat.reason] = (raisons[resultat.reason]||0) + 1;
    done++;
  }
  const detail = Object.entries(raisons).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([raison,n])=>`${n}× ${raison}`).join(' · ');
  statusEl.innerHTML = `Terminé : ${ok}/${aTraiter.length} document(s) traité(s).<br><span style="font-size:11.5px;">${detail}</span>`;
  btn.disabled = false;
  await loadReferenceData();
  loadRecapSalaires();
  loadSalairesLibrary();
}

// Logique d'envoi partagée entre l'ajout unitaire et l'import groupé
async function uploadBulletin(collaborateurId, mois, typeDocument, file){
  const exercice = findExerciceForDate(`${mois}-01`);
  if(!exercice) return { ok:false, message:`Aucun exercice comptable ne couvre ${mois}.` };

  const collaborateur = STATE.collaborateurs.find(c=>c.id===collaborateurId);
  const { data: existant } = await sb.from('salaires')
    .select('*')
    .eq('collaborateur_id', collaborateurId)
    .eq('mois', mois)
    .eq('type_document', typeDocument)
    .maybeSingle();

  let importId = existant?.document_id;
  if(importId){
    await sb.from('imports').update({ nom_fichier: file.name }).eq('id', importId);
  } else {
    const { data: importRow, error: importErr } = await sb.from('imports').insert({
      exercice_id: exercice.id, type_import: 'salaire', mois, nom_fichier: file.name, statut: 'importé'
    }).select().single();
    if(importErr) return { ok:false, message: importErr.message };
    importId = importRow.id;
  }

  const path = `${collaborateurId}/${mois}_${typeDocument}_${Date.now()}_${sanitizeFilename(file.name)}`;
  const { error: uploadErr } = await sb.storage.from('bulletins-salaire').upload(path, file, { upsert:true });
  if(uploadErr) return { ok:false, message: uploadErr.message };
  await sb.from('imports').update({ chemin_storage: path }).eq('id', importId);

  let salaireRow = existant;
  if(existant){
    await sb.from('salaires').update({ document_id: importId }).eq('id', existant.id);
  } else {
    const { data: inserted, error: salErr } = await sb.from('salaires').insert({
      exercice_id: exercice.id,
      collaborateur_id: collaborateurId,
      mois,
      type_document: typeDocument,
      affectation: collaborateur?.affectation || null,
      document_id: importId,
      statut: 'a_verifier'
    }).select().single();
    if(salErr) return { ok:false, message: salErr.message };
    salaireRow = inserted;
  }

  if(/\.pdf$/i.test(file.name)){
    await appliquerExtractionSurSalaire(salaireRow, collaborateurId, file);
  }

  enregistrerAudit(existant ? 'remplacement_document' : 'import_bulletin_salaire', {
    tableConcernee: 'salaires',
    elementId: salaireRow.id,
    resume: `${existant?'Document remplacé':'Bulletin importé'} : ${TYPE_DOCUMENT_LABELS[typeDocument]||typeDocument} de ${collaborateur?.nom||'salarié inconnu'} (${mois})`,
    details: { collaborateur_id: collaborateurId, mois, type_document: typeDocument, nom_fichier: file.name }
  });

  return { ok:true };
}

async function handleSalaireFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('salaire-import-status');
  const moisInput = document.getElementById('salaire-mois-input');
  const typeSelect = document.getElementById('salaire-type-select');
  const mois = moisInput.value;
  const typeDocument = typeSelect.value;
  const resetInput = () => { e.target.value = ''; };

  if(!mois){
    statusEl.innerHTML = `<div class="error-msg">Choisissez d'abord le mois concerné par ce document.</div>`;
    resetInput();
    return;
  }
  if(!/\.pdf$/i.test(file.name)){
    statusEl.innerHTML = `<div class="error-msg">« ${escapeHTML(file.name)} » n'est pas un PDF — c'est le seul format accepté ici.</div>`;
    resetInput();
    return;
  }

  const res = await uploadBulletin(SALARIE_SELECTED_ID, mois, typeDocument, file);
  if(!res.ok){
    statusEl.innerHTML = `<div class="error-msg">Erreur : ${res.message}</div>`;
    resetInput();
    return;
  }
  statusEl.innerHTML = `<div class="badge green" style="font-size:13px;">Document attaché ✔</div>`;
  resetInput();
  moisInput.value = '';
  loadSalairesLibrary();
}

function handleBulkFolderSelect(e){
  const files = Array.from(e.target.files).filter(f=>/\.pdf$/i.test(f.name));
  const preview = document.getElementById('salaire-bulk-preview');
  if(files.length===0){
    preview.innerHTML = `<div class="error-msg">Aucun fichier PDF trouvé dans ce dossier.</div>`;
    return;
  }
  BULK_ROWS = files.map(file=>{
    const { personSegment, typeDocument, mois } = parseNomFichierBulletin(file.name);
    const collab = deviverCollaborateur(personSegment);
    return { file, personSegment, collaborateurId: collab?.id || '', mois: mois || '', typeDocument };
  });

}

function renderBulkPreview(){
  const preview = document.getElementById('salaire-bulk-preview');
  const nbOk = BULK_ROWS.filter(r=>r.collaborateurId && r.mois).length;
  preview.innerHTML = `
    <div class="hint" style="margin-bottom:10px;">${nbOk}/${BULK_ROWS.length} fichier(s) reconnu(s) automatiquement.</div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Fichier</th><th>Salarié</th><th>Mois</th><th>Type</th></tr></thead>
      <tbody>
        ${BULK_ROWS.map((r,i)=>`
          <tr style="${(!r.collaborateurId || !r.mois) ? 'background:rgba(220,38,38,.08);' : ''}">
            <td style="font-size:12.5px;">${escapeHTML(r.file.name)}</td>
            <td>
              <select class="bulk-collab-select" data-idx="${i}" style="padding:6px 8px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;">
                <option value="">— Choisir —</option>
                ${STATE.collaborateurs.map(c=>`<option value="${c.id}" ${c.id===r.collaborateurId?'selected':''}>${escapeHTML(c.nom)}</option>`).join('')}
                <option value="__new__">+ Nouveau salarié…</option>
              </select>
            </td>
            <td><input type="month" class="bulk-mois-input" data-idx="${i}" value="${r.mois}" style="padding:6px 8px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;"></td>
            <td>
              <select class="bulk-type-select" data-idx="${i}" style="padding:6px 8px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;">
                <option value="bulletin" ${r.typeDocument==='bulletin'?'selected':''}>Bulletin de salaire</option>
                <option value="solde_tout_compte" ${r.typeDocument==='solde_tout_compte'?'selected':''}>Solde de tout compte</option>
              </select>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    </div>
    <div style="margin-top:14px;display:flex;align-items:center;gap:12px;">
      <button class="btn" id="bulk-import-btn">Importer les ${BULK_ROWS.length} fichier(s)</button>
      <span id="bulk-import-progress" class="hint"></span>
    </div>
  `;

  preview.querySelectorAll('.bulk-collab-select').forEach(sel=>{
    sel.addEventListener('change', async (e)=>{
      const idx = +e.target.dataset.idx;
      if(e.target.value !== '__new__'){ BULK_ROWS[idx].collaborateurId = e.target.value; return; }
      const nom = prompt('Nom du nouveau salarié :', BULK_ROWS[idx].personSegment);
      if(!nom){ renderBulkPreview(); return; }
      const { data, error } = await sb.from('collaborateurs').insert({ nom, actif:true }).select().single();
      if(error){ alert('Erreur : ' + error.message); renderBulkPreview(); return; }
      STATE.collaborateurs.push(data);
      enregistrerAudit('creation_salarie', {
        tableConcernee: 'collaborateurs', elementId: data.id,
        resume: `Salarié créé : ${nom} (depuis l'import de bulletins)`
      });
      BULK_ROWS.forEach(r=>{ if(!r.collaborateurId){ const m = deviverCollaborateur(r.personSegment); if(m) r.collaborateurId = m.id; } });
      renderBulkPreview();
    });
  });
  preview.querySelectorAll('.bulk-mois-input').forEach(inp=>{
    inp.addEventListener('change', e=>{ BULK_ROWS[+e.target.dataset.idx].mois = e.target.value; });
  });
  preview.querySelectorAll('.bulk-type-select').forEach(sel=>{
    sel.addEventListener('change', e=>{ BULK_ROWS[+e.target.dataset.idx].typeDocument = e.target.value; });
  });
  document.getElementById('bulk-import-btn').addEventListener('click', runBulkImport);
}

async function runBulkImport(){
  const btn = document.getElementById('bulk-import-btn');
  const progress = document.getElementById('bulk-import-progress');
  const rows = BULK_ROWS.filter(r=>r.collaborateurId && r.mois);
  const skipped = BULK_ROWS.length - rows.length;
  if(rows.length===0){ progress.textContent = 'Aucune ligne complète à importer.'; return; }
  btn.disabled = true;
  let done = 0, erreurs = 0;
  for(const r of rows){
    progress.textContent = `Import en cours... ${done+1}/${rows.length}`;
    const res = await uploadBulletin(r.collaborateurId, r.mois, r.typeDocument, r.file);
    if(!res.ok) erreurs++;
    done++;
  }
  progress.textContent = `Terminé : ${done-erreurs}/${rows.length} importé(s)${erreurs?`, ${erreurs} erreur(s)`:''}${skipped?`, ${skipped} ligne(s) ignorée(s) (salarié ou mois manquant)`:''}.`;
  btn.disabled = false;
  BULK_ROWS = [];
  loadSalairesLibrary();
}

async function loadSalairesLibrary(){
  const container = document.getElementById('salaires-groups');
  if(!SALARIE_SELECTED_ID){ container.innerHTML = `<div class="empty">Sélectionnez un salarié.</div>`; return; }

  const { data: salaires } = await sb.from('salaires')

function parseNombreFR(str){
  if(str==null) return null;
  const n = parseFloat(String(str).replace(/\s/g,'').replace(',','.'));
  return isNaN(n) ? null : n;
}

// Le rapport "Synthèse des ventes" du logiciel de caisse imprime toujours les mêmes
// libellés de magasin, différents des noms utilisés ailleurs dans l'appli.
function deviverMagasinVendeur(labelBrut){
  const norm = sansAccents(labelBrut||'').toUpperCase();
  let code = null;
  if(norm.includes('MERIDIEN')) code = 'IBOS';
  else if(norm.includes('ORMEAU')) code = 'TARBES';
  else if(norm.includes('PAU')) code = 'PAU';
  return code ? STATE.magasins.find(m=>m.code===code) : null;
}

// Table "Vendeur / HT / TTC / Nb Ventes / Nb Articles / Panier / Nb Art Moyen" avec des
// sous-totaux par magasin intercalés. L'ordre du texte pdf.js est mélangé colonne par
// colonne (pas ligne par ligne) : on regroupe donc par position (x,y) plutôt que par ordre.
function analyserVentesVendeurPdf(items){
  const headerVendeur = items.find(it=>it.str.trim()==='Vendeur');
  const footer = items.find(it=>it.str.trim().startsWith('Nombre de lignes'));
  if(!headerVendeur) return [];
  const yHaut = headerVendeur.y;
  const yBas = footer ? footer.y : 0;

  const colonneDe = (x) => {
    if(x < 100) return 'nom';
    if(x < 260) return 'ht';
    if(x < 320) return 'ttc';
    if(x < 400) return 'nbVentes';
    if(x < 440) return 'nbArticles';
    if(x < 500) return 'panier';
    return 'nbArtMoyen';
  };

  const lignesItems = items.filter(it => it.str.trim()!=='' && it.y < yHaut && it.y > yBas);
  const groupes = [];
  for(const it of lignesItems){
    let g = groupes.find(g=>Math.abs(g.y - it.y) < 2);
    if(!g){ g = { y: it.y, items: [] }; groupes.push(g); }
    g.items.push(it);
  }
  groupes.sort((a,b)=> b.y - a.y);

  const MAGASINS_CONNUS = ['Tarbes Meridien', 'Pau', 'Tarbes Ormeau'];
  let magasinActuel = null;
  const brutes = [];
  for(const g of groupes){
    const col = {};
    for(const it of g.items) col[colonneDe(it.x)] = it.str.trim();
    const nom = col.nom || null;
    if(nom && MAGASINS_CONNUS.includes(nom)){ magasinActuel = nom; continue; }
    brutes.push({
      magasin: magasinActuel, vendeur: nom || '(non attribué)',
      ht: parseNombreFR(col.ht), ttc: parseNombreFR(col.ttc),
      nbVentes: parseNombreFR(col.nbVentes), nbArticles: parseNombreFR(col.nbArticles),
      panier: parseNombreFR(col.panier), nbArtMoyen: parseNombreFR(col.nbArtMoyen),
    });
  }

  // Fusionne les lignes dupliquées (ex: un vendeur ayant utilisé deux caisses/sessions) :
  // le panier moyen imprimé (TTC/nb ventes) n'est recalculé qu'en cas de fusion réelle,
  // sinon on garde tel quel la valeur du document plutôt que de la reconstruire.
  const groupesFusion = {};
  for(const b of brutes){
    const cle = `${b.magasin}||${b.vendeur}`;
    if(!groupesFusion[cle]) groupesFusion[cle] = [];
    groupesFusion[cle].push(b);
  }
  return Object.values(groupesFusion).map(lignes=>{
    if(lignes.length===1) return lignes[0];
    const f = { magasin: lignes[0].magasin, vendeur: lignes[0].vendeur, ht:0, ttc:0, nbVentes:0, nbArticles:0 };
    for(const b of lignes){ f.ht+=b.ht||0; f.ttc+=b.ttc||0; f.nbVentes+=b.nbVentes||0; f.nbArticles+=b.nbArticles||0; }
    f.panier = f.nbVentes>0 ? Math.round((f.ttc/f.nbVentes)*100)/100 : null;
    f.nbArtMoyen = f.nbVentes>0 ? Math.round((f.nbArticles/f.nbVentes)*100)/100 : null;
    return f;
  });
}

async function handleVentesVendeurFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('vendeur-import-status');
  const moisInput = document.getElementById('vendeur-mois-input');
  const mois = moisInput.value;
  const resetInput = () => { e.target.value = ''; };

  if(!mois){ statusEl.innerHTML = `<div class="error-msg">Choisissez d'abord le mois concerné.</div>`; resetInput(); return; }
  if(!/\.pdf$/i.test(file.name)){ statusEl.innerHTML = `<div class="error-msg">« ${escapeHTML(file.name)} » n'est pas un PDF.</div>`; resetInput(); return; }

  statusEl.innerHTML = `<div class="hint">Analyse du document...</div>`;
  if(!(await attendrePdfjs())){ statusEl.innerHTML = `<div class="error-msg">pdf.js non chargé (bloqueur de script/pub ? pas de connexion internet ?)</div>`; resetInput(); return; }

  let items;
  try{ items = await extraireItemsPdf(file); }
  catch(err){ statusEl.innerHTML = `<div class="error-msg">Lecture du PDF impossible : ${err.message}</div>`; resetInput(); return; }

  const lignes = analyserVentesVendeurPdf(items);
  if(lignes.length===0){ statusEl.innerHTML = `<div class="error-msg">Aucune ligne reconnue — ce document ne ressemble pas à une synthèse des ventes par vendeur.</div>`; resetInput(); return; }

  VENDEUR_BULK_FILE = file;
  VENDEUR_BULK_MOIS = mois;
  VENDEUR_BULK_ROWS = lignes.map(l=>{
    const magasin = deviverMagasinVendeur(l.magasin);
    const collab = (l.vendeur!=='(non attribué)' && l.vendeur!=='Soutien') ? deviverCollaborateur(l.vendeur) : null;
    return { ...l, magasinId: magasin?.id || '', collaborateurId: collab?.id || '' };
  });
  statusEl.innerHTML = '';
  renderVendeurBulkPreview();
}

// Logique d'import partagée entre l'ajout unitaire et l'import groupé par dossier
async function importerSyntheseVentes(file, mois, rowsAvecMatching){
  const rows = rowsAvecMatching.filter(r=>r.magasinId);
  const ignorees = rowsAvecMatching.length - rows.length;
  if(rows.length===0) return { ok:false, message:'Aucune ligne rattachée à un magasin.' };

  const exercice = findExerciceForDate(`${mois}-01`);
  if(!exercice) return { ok:false, message:`Aucun exercice comptable ne couvre ${mois}.` };

  const { data: existant } = await sb.from('imports')
    .select('id').eq('type_import','ventes_vendeur').eq('mois', mois).maybeSingle();
  let importId = existant?.id;
  if(importId){
    await sb.from('imports').update({ nom_fichier: file.name }).eq('id', importId);
  } else {
    const { data: inserted, error: impErr } = await sb.from('imports').insert({
      exercice_id: exercice.id, type_import: 'ventes_vendeur', mois,
      nom_fichier: file.name, statut: 'importé'
    }).select().single();
    if(impErr) return { ok:false, message: impErr.message };
    importId = inserted.id;
  }

  const path = `${mois}/${Date.now()}_${sanitizeFilename(file.name)}`;
  const { error: uploadErr } = await sb.storage.from('ventes-vendeur').upload(path, file, { upsert:true });
  if(uploadErr) return { ok:false, message: uploadErr.message };
  await sb.from('imports').update({ chemin_storage: path }).eq('id', importId);

  let ok = 0;
  for(const r of rows){
    const { error } = await sb.from('ventes_vendeur').upsert({
      exercice_id: exercice.id, import_id: importId, collaborateur_id: r.collaborateurId || null,
      magasin_id: r.magasinId, mois, nom_vendeur_brut: r.vendeur,
      ht: r.ht, ttc: r.ttc, nb_ventes: r.nbVentes, nb_articles: r.nbArticles,
      panier_moyen: r.panier, nb_articles_moyen: r.nbArtMoyen
    }, { onConflict: 'magasin_id,mois,nom_vendeur_brut' });
    if(!error) ok++;
  }

  enregistrerAudit('import_ca_vendeur', {
    tableConcernee: 'imports',
    elementId: importId,
    resume: `Import CA par vendeur ${mois} : ${ok} ligne(s) importée(s)${ignorees>0?`, ${ignorees} ignorée(s) (sans magasin)`:''}`,
    details: { mois, nom_fichier: file.name, nb_importees: ok, nb_ignorees: ignorees }
  });

  return { ok:true, nbImportees: ok, nbIgnorees: ignorees };
}

async function runVendeurBulkImport(){
  const btn = document.getElementById('vendeur-bulk-import-btn');
  const progress = document.getElementById('vendeur-bulk-progress');
  btn.disabled = true;
  progress.textContent = 'Import en cours...';
  const res = await importerSyntheseVentes(VENDEUR_BULK_FILE, VENDEUR_BULK_MOIS, VENDEUR_BULK_ROWS);
  if(!res.ok){ progress.textContent = 'Erreur : ' + res.message; btn.disabled = false; return; }
  progress.textContent = `Terminé : ${res.nbImportees} ligne(s) importée(s)${res.nbIgnorees?`, ${res.nbIgnorees} ignorée(s) (pas de magasin)`:''}.`;

  VENDEUR_BULK_ROWS = [];
  document.getElementById('vendeur-bulk-preview').innerHTML = '';
  loadVendeurLeaderboard();
  loadVendeurHistorique();
}

/* --- Import groupé par dossier (plusieurs mois/années à la fois) --- */
let VENDEUR_BULK_FOLDER_RESULTS = [];

// Reconnaît "..._Mois_Annee.pdf" (ex: chiffre_d_affaires_vendeur_juin_2026.pdf)
function deviverMoisDepuisNomFichier(filename){
  const base = filename.replace(/\.pdf$/i, '');
  const m = base.match(/_([A-Za-zÀ-ÿ]+)_(\d{4})$/);
  if(!m) return null;
  const moisNum = MOIS_FR[sansAccents(m[1]).toLowerCase()];
  return moisNum ? `${m[2]}-${String(moisNum).padStart(2,'0')}` : null;
}

async function handleVendeurBulkFolderSelect(e){
  const files = Array.from(e.target.files).filter(f=>/\.pdf$/i.test(f.name));
  const preview = document.getElementById('vendeur-bulk-folder-preview');
  if(files.length===0){ preview.innerHTML = `<div class="error-msg">Aucun fichier PDF trouvé dans ce dossier.</div>`; return; }

  preview.innerHTML = `<div class="hint">Analyse de ${files.length} fichier(s)...</div>`;
  if(!(await attendrePdfjs())){ preview.innerHTML = `<div class="error-msg">pdf.js non chargé (bloqueur de script/pub ? pas de connexion internet ?)</div>`; return; }

  const resultats = [];
  for(const file of files){
    const mois = deviverMoisDepuisNomFichier(file.name);
    let lignes = [];
    let erreur = null;
    if(!mois){
      erreur = 'mois non reconnu dans le nom du fichier';
    } else {
      try{
        const items = await extraireItemsPdf(file);
        const brutes = analyserVentesVendeurPdf(items);
        if(brutes.length===0){ erreur = 'aucune ligne reconnue'; }
        lignes = brutes.map(l=>{
          const magasin = deviverMagasinVendeur(l.magasin);
          const collab = (l.vendeur!=='(non attribué)' && l.vendeur!=='Soutien') ? deviverCollaborateur(l.vendeur) : null;
          return { ...l, magasinId: magasin?.id || '', collaborateurId: collab?.id || '' };
        });
      } catch(err){ erreur = 'lecture impossible : ' + err.message; }
    }
    resultats.push({ file, mois, lignes, erreur });
  }
  VENDEUR_BULK_FOLDER_RESULTS = resultats;
  renderVendeurBulkFolderPreview();
}

function renderVendeurBulkFolderPreview(){
  const preview = document.getElementById('vendeur-bulk-folder-preview');
  const valides = VENDEUR_BULK_FOLDER_RESULTS.filter(r=>!r.erreur);

async function runVendeurBulkFolderImport(){
  const btn = document.getElementById('vendeur-bulk-folder-import-btn');
  const progress = document.getElementById('vendeur-bulk-folder-progress');
  const valides = VENDEUR_BULK_FOLDER_RESULTS.filter(r=>!r.erreur);
  btn.disabled = true;
  let done = 0, ok = 0;
  for(const r of valides){
    progress.textContent = `Import en cours... ${done+1}/${valides.length} (${r.mois})`;
    const res = await importerSyntheseVentes(r.file, r.mois, r.lignes);
    if(res.ok) ok++;
    done++;
  }
  progress.textContent = `Terminé : ${ok}/${valides.length} fichier(s) importé(s).`;
  btn.disabled = false;
  VENDEUR_BULK_FOLDER_RESULTS = [];
  document.getElementById('vendeur-bulk-folder-preview').innerHTML = '';
  loadVendeurLeaderboard();
  loadVendeurHistorique();
}

    .select('*, magasins(nom)')

  const trie = [...data].sort((a,b)=>{
    const va = Number(a[champ]) || 0, vb = Number(b[champ]) || 0;
    return dir==='desc' ? vb-va : va-vb;

            <td style="text-align:right;">${r.nb_ventes ?? '—'}</td>
            <td style="text-align:right;">${r.panier_moyen!=null ? fmtEUR(r.panier_moyen) : '—'}</td>
          </tr>`).join('')}
      </tbody>
    </table>

async function fetchToutesLesLignes(buildQuery){
  const PAGE = 1000;
  let from = 0;
  let toutes = [];
  while(true){
    const { data, error } = await buildQuery().range(from, from + PAGE - 1);
    if(error){ console.error('Erreur pagination :', error); break; }
    if(!data || data.length===0) break;
    toutes = toutes.concat(data);
    if(data.length < PAGE) break;
    from += PAGE;
  }
  return toutes;
}

async function loadControleRows(){
  let rangeStart = null, rangeEnd = null;
  if(CONTROLE_ANNEES.size>0){
    const anneesArr = Array.from(CONTROLE_ANNEES);
    rangeStart = `${Math.min(...anneesArr)}-01-01`;
    rangeEnd = `${Math.max(...anneesArr)}-12-31T23:59:59`;
  }
  let data = await fetchToutesLesLignes(()=>{
    let q = sb.from('operations_bancaires').select('*').order('date_operation',{ascending:false});
    if(CONTROLE_FILTER!=='toutes') q = q.eq('etat', CONTROLE_FILTER);
    if(SANS_JUSTIFICATIF_ONLY){ q = q.not('debit','is', null).is('piece_jointe_path', null).eq('justificatif_non_requis', false); }
    if(rangeStart) q = q.gte('date_operation', rangeStart).lte('date_operation', rangeEnd);
    return q;
  });
  const container = document.getElementById('controle-groups');
  if(!data || data.length===0){ container.innerHTML = `<div class="empty">Aucune opération.</div>`; return; }

  // Tri (à l'intérieur de chaque mois, les mois eux-mêmes restent du plus récent au plus ancien)
  const categoryMap = new Map(STATE.categories.map(c=>[c.id, c.libelle]));
  const etatOrdre = {a_categoriser:0, a_verifier:1, reconnu_auto:2, valide_manuel:3};
  data.sort((a,b)=>{
    let va, vb;
    if(CONTROLE_TRI_CHAMP==='libelle'){ va=(a.libelle||'').toLowerCase(); vb=(b.libelle||'').toLowerCase(); }
    else if(CONTROLE_TRI_CHAMP==='categorie'){
      va=(categoryMap.get(a.categorie_finale_id||a.categorie_proposee_id)||'').toLowerCase();
      vb=(categoryMap.get(b.categorie_finale_id||b.categorie_proposee_id)||'').toLowerCase();
    }
    else if(CONTROLE_TRI_CHAMP==='montant'){ va=Number(a.debit||a.credit||0); vb=Number(b.debit||b.credit||0); }
    else if(CONTROLE_TRI_CHAMP==='etat'){ va=etatOrdre[a.etat]??0; vb=etatOrdre[b.etat]??0; }
    else { va=a.date_operation; vb=b.date_operation; }
    let cmp = (typeof va==='string') ? va.localeCompare(vb) : va-vb;
    return CONTROLE_TRI_DIR==='asc' ? cmp : -cmp;
  });

  // Filtre par année (pastilles) — sécurité en plus du filtre serveur (années non contiguës)
  if(CONTROLE_ANNEES.size>0){
    data = data.filter(op => CONTROLE_ANNEES.has(new Date(op.date_operation).getFullYear()));
  }

  // Regroupement par mois/année
  const groups = {};
  data.forEach(op=>{
    const d = new Date(op.date_operation);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!groups[key]) groups[key] = { label: d.toLocaleDateString('fr-FR',{month:'long', year:'numeric'}), rows: [] };
    groups[key].rows.push(op);
  });
  const keys = Object.keys(groups).sort().reverse();
  // Tous les mois sont repliés par défaut (l'utilisateur ouvre lui-même ce qu'il veut voir)

  container.innerHTML = keys.map(key=>{
    const g = groups[key];
    const isOpen = OPEN_MOIS.has(key);
    const label = g.label.charAt(0).toUpperCase() + g.label.slice(1);
    return `
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 18px;">
        <input type="checkbox" class="select-all-mois" data-mois="${key}" title="Tout sélectionner ce mois">
        <button class="mois-toggle" data-mois="${key}" style="flex:1;text-align:left;background:none;border:none;font-weight:700;font-size:14px;cursor:pointer;color:var(--text);display:flex;justify-content:space-between;align-items:center;padding:0;">
          <span>${label}</span>
          <span style="font-weight:600;color:var(--muted);font-size:12.5px;">${g.rows.length} opération(s) <span class="chevron">${isOpen?'▲':'▼'}</span></span>
        </button>
      </div>
      <div class="mois-content" data-mois-content="${key}" style="display:${isOpen?'block':'none'};border-top:1px solid var(--border);">
        <div class="hscroll-top" data-hscroll-top="${key}"><div class="hscroll-top-inner" data-hscroll-inner="${key}"></div></div>
        <div class="hscroll-body" data-hscroll-body="${key}">
          <table style="width:auto;min-width:1100px;">
            <thead><tr>
              <th></th><th>Date</th><th>Libellé</th><th>Débit</th><th>Crédit</th>
              <th>Catégorie</th><th>Affectation</th><th>État</th><th>Justificatif</th><th></th>
            </tr></thead>
            <tbody>${g.rows.map(buildRowHtml).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');

  // Barre de défilement horizontale fixée sous l'en-tête, synchronisée avec le tableau
  function majLargeurHscroll(key){
    const bodyEl = container.querySelector(`[data-hscroll-body="${key}"]`);
    const innerEl = container.querySelector(`[data-hscroll-inner="${key}"]`);
    if(!bodyEl || !innerEl) return;
    const table = bodyEl.querySelector('table');
    innerEl.style.width = table.scrollWidth + 'px';
  }
  container.querySelectorAll('[data-hscroll-body]').forEach(bodyEl=>{
    const key = bodyEl.dataset.hscrollBody;
    const topEl = container.querySelector(`[data-hscroll-top="${key}"]`);
    if(OPEN_MOIS.has(key)) majLargeurHscroll(key);
    let sync = false;
    topEl.addEventListener('scroll', ()=>{ if(sync) return; sync=true; bodyEl.scrollLeft = topEl.scrollLeft; sync=false; });
    bodyEl.addEventListener('scroll', ()=>{ if(sync) return; sync=true; topEl.scrollLeft = bodyEl.scrollLeft; sync=false; });
  });

  container.querySelectorAll('.mois-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.mois;
      const el = container.querySelector(`.mois-content[data-mois-content="${key}"]`);
      const willOpen = el.style.display === 'none';
      el.style.display = willOpen ? 'block' : 'none';
      if(willOpen){ OPEN_MOIS.add(key); majLargeurHscroll(key); } else OPEN_MOIS.delete(key);
      btn.querySelector('.chevron').textContent = willOpen ? '▲' : '▼';
    });
  });
  container.querySelectorAll('.select-all-mois').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = cb.dataset.mois;
      container.querySelectorAll(`.mois-content[data-mois-content="${key}"] .row-check`).forEach(rc=>rc.checked = cb.checked);
      updateSelectionCount();
    });
  });
  container.querySelectorAll('.row-check').forEach(cb=>cb.addEventListener('change', updateSelectionCount));
  container.querySelectorAll('tr[data-id]').forEach(tr=>wireRowEvents(tr));
  updateSelectionCount();
}

async function setJustificatifNonRequis(id, value){
  const { error } = await sb.from('operations_bancaires').update({ justificatif_non_requis: value }).eq('id', id);
  if(error){ toast('Erreur : ' + error.message); return; }
  toast(value ? 'Marquée « sans justificatif » ✔' : 'Justificatif de nouveau requis');
  loadControleRows();
}

async function handleJustificatifUpload(tr, file){
  if(!file) return;
  const id = tr.dataset.id;
  const cleanName = sanitizeFilename(file.name);
  const path = `${STATE.currentExercice.id}/${id}/${Date.now()}_${cleanName}`;
  toast('Envoi du fichier...');
  const { error: uploadErr } = await sb.storage.from('justificatifs').upload(path, file, { upsert:true });
  if(uploadErr){
    console.error('Erreur upload justificatif :', uploadErr);
    alert('Erreur lors de l\'envoi du fichier :\n' + uploadErr.message + '\n\nVérifiez que le bucket "justificatifs" existe bien dans Supabase > Storage.');
    return;
  }

  const { error: updateErr } = await sb.from('operations_bancaires').update({
    piece_jointe_path: path,
    piece_jointe_nom: file.name,
    piece_jointe_ajoutee_le: new Date().toISOString()
  }).eq('id', id);
  if(updateErr){
    console.error('Erreur enregistrement justificatif :', updateErr);
    alert('Le fichier a été envoyé mais l\'enregistrement a échoué :\n' + updateErr.message);
    return;
  }

  toast('Justificatif ajouté ✔');
  loadControleRows();
}

function sanitizeFilename(name){
  return name
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9.\-_]/g, '_');
}

async function voirJustificatif(path){
  if(!path) return;
  const { data, error } = await sb.storage.from('justificatifs').createSignedUrl(path, 60);
  if(error){ toast('Impossible d\'ouvrir le fichier : ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

let REGLES_CACHE = { regles: [], categories: [] };

async function loadReglesAdmin(){
  const [{ data: regles }, { data: toutesCategories }] = await Promise.all([
    sb.from('regles_categorisation').select('*').order('mot_cle'),
    sb.from('categories').select('*').order('libelle')
  ]);
  REGLES_CACHE.regles = regles || [];
  REGLES_CACHE.categories = toutesCategories || [];

  const searchInput = document.getElementById('regle-search');
  if(searchInput && !searchInput.dataset.wired){
    searchInput.dataset.wired = '1';
    searchInput.addEventListener('input', ()=> renderReglesTable(searchInput.value));
  }
  renderReglesTable(searchInput ? searchInput.value : '');
}

function renderReglesTable(recherche){
  const { regles, categories } = REGLES_CACHE;
  const tbody = document.getElementById('regle-tbody');
  if(!regles || regles.length===0){ tbody.innerHTML = `<tr><td colspan="6" class="empty">Aucune règle.</td></tr>`; return; }

  const terme = (recherche||'').trim().toLowerCase();
  const catMap = new Map(categories.map(c=>[c.id, c.libelle]));
  let filtres = regles;
  if(terme){
    filtres = regles.filter(r => (r.mot_cle||'').toLowerCase().includes(terme));
  }
  if(filtres.length===0){ tbody.innerHTML = `<tr><td colspan="6" class="empty">Aucun mot-clé ne correspond à "${escapeHTML(recherche)}".</td></tr>`; return; }

  const sorted = [...filtres].sort((a,b)=>{
    const ca = catMap.get(a.categorie_id) || '';
    const cb = catMap.get(b.categorie_id) || '';
    return ca.localeCompare(cb) || a.mot_cle.localeCompare(b.mot_cle);
  });

  tbody.innerHTML = sorted.map(r=>`
    <tr data-id="${r.id}">
      <td><input type="text" class="rename-regle-input" value="${(r.mot_cle||'').replace(/"/g,'&quot;')}" style="width:100%;max-width:180px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px;"></td>
      <td>
        <select class="regle-categorie-select row-select">
          ${categories.map(c=>`<option value="${c.id}" ${c.id===r.categorie_id?'selected':''}>${escapeHTML(c.libelle)}</option>`).join('')}
        </select>
      </td>
      <td>
        <select class="regle-affectation-select row-select">
          ${affectationsDisponibles().map(a=>`<option value="${a}" ${a===r.affectation?'selected':''}>${a}</option>`).join('')}
        </select>
      </td>
      <td>${r.confiance}%</td>
      <td><span class="badge ${r.actif?'green':'red'}">${r.actif?'Active':'Désactivée'}</span></td>
      <td>
        <button class="btn secondary small toggle-regle-btn">${r.actif?'Désactiver':'Réactiver'}</button>
        ${!r.actif ? `<button class="btn secondary small supprimer-regle-btn" style="margin-left:6px;color:#c22b2b;">🗑️</button>` : ''}
      </td>
    </tr>`).join('');

  tbody.querySelectorAll('tr').forEach(tr=>{
    const id = tr.dataset.id;
    tr.querySelector('.rename-regle-input').addEventListener('change', async (e)=>{
      const v = e.target.value.trim();
      if(!v) return;
      const ancien = e.target.defaultValue;
      const { error } = await sb.from('regles_categorisation').update({ mot_cle: v }).eq('id', id);
      if(error){ toast('Erreur : ' + error.message); return; }
      toast('Mot-clé renommé ✔');
      enregistrerAudit('modification_regle', { tableConcernee: 'regles_categorisation', elementId: id, resume: `Règle renommée : "${ancien}" → "${v}"` });
    });
    tr.querySelector('.regle-categorie-select').addEventListener('change', async (e)=>{
      const { error } = await sb.from('regles_categorisation').update({ categorie_id: e.target.value }).eq('id', id);
      if(error){ toast('Erreur : ' + error.message); return; }
      toast('Catégorie mise à jour ✔');
      enregistrerAudit('modification_regle', { tableConcernee: 'regles_categorisation', elementId: id, resume: `Catégorie de la règle "${tr.querySelector('.rename-regle-input').value}" modifiée` });
    });
    tr.querySelector('.regle-affectation-select').addEventListener('change', async (e)=>{
      const { error } = await sb.from('regles_categorisation').update({ affectation: e.target.value }).eq('id', id);
      if(error){ toast('Erreur : ' + error.message); return; }
      toast('Affectation mise à jour ✔');
      enregistrerAudit('modification_regle', { tableConcernee: 'regles_categorisation', elementId: id, resume: `Affectation de la règle "${tr.querySelector('.rename-regle-input').value}" modifiée : ${e.target.value}` });
    });
    tr.querySelector('.toggle-regle-btn').addEventListener('click', async ()=>{
      const { data: current } = await sb.from('regles_categorisation').select('actif').eq('id', id).single();
      const { error } = await sb.from('regles_categorisation').update({ actif: !current.actif }).eq('id', id);
      if(error){ toast('Erreur : ' + error.message); return; }
      loadReglesAdmin();
      enregistrerAudit('modification_regle', { tableConcernee: 'regles_categorisation', elementId: id, resume: `Règle "${tr.querySelector('.rename-regle-input').value}" ${!current.actif?'activée':'désactivée'}` });
    });
    const supprimerBtn = tr.querySelector('.supprimer-regle-btn');
    if(supprimerBtn){
      supprimerBtn.addEventListener('click', async ()=>{
        if(!confirm('Supprimer définitivement ce mot-clé ?')) return;
        const motCleSupprime = tr.querySelector('.rename-regle-input').value;
        const { error } = await sb.from('regles_categorisation').delete().eq('id', id);
        if(error){ toast('Suppression impossible : ' + error.message); return; }
        toast('Mot-clé supprimé ✔');
        loadReglesAdmin();
        enregistrerAudit('suppression_regle', { tableConcernee: 'regles_categorisation', elementId: id, resume: `Règle supprimée : "${motCleSupprime}"` });
      });
    }
  });
}

async function reappliquerReglesNonValidees(){
  if(!confirm(`Relire toutes les opérations non validées avec les règles actuelles, toutes années confondues ?`)) return;

  const { data: regles } = await sb.from('regles_categorisation').select('*').eq('actif', true).order('priorite');
  if(!regles || regles.length===0){ toast('Aucune règle active.'); return; }

  const operations = await fetchToutesLesLignes(()=>
    sb.from('operations_bancaires').select('id, libelle, etat')
      .neq('etat', 'valide_manuel')
  );
  if(!operations || operations.length===0){ toast('Aucune opération à relire.'); return; }

  function trouverRegle(libelle){
    const low = (libelle||'').toLowerCase();
    for(const r of regles){
      if(low.includes(r.mot_cle.toLowerCase())) return r;
    }
    return null;
  }

  let miseAJour = 0;
  await Promise.all(operations.map(async (op)=>{
    const match = trouverRegle(op.libelle);
    if(!match) return;
    const nouvelEtat = match.validation_auto ? 'valide_manuel' : (match.confiance >= 95 ? 'reconnu_auto' : 'a_verifier');
    if(nouvelEtat === op.etat) return; // rien de neuf pour cette ligne
    const payload = {
      categorie_proposee_id: match.categorie_id,
      affectation: match.affectation || 'COMMUN',
      mot_cle_reconnu: match.mot_cle,
      confiance: match.confiance,
      etat: nouvelEtat
    };
    if(match.validation_auto){
      payload.categorie_finale_id = match.categorie_id;
      payload.valide_manuellement = true;
    }
    const { error } = await sb.from('operations_bancaires').update(payload).eq('id', op.id);
    if(!error) miseAJour++;
  }));

  toast(`${miseAJour} opération(s) mise(s) à jour avec les règles actuelles ✔`);
}

async function genererReglesManquantes(){
  const { data: reglesActives } = await sb.from('regles_categorisation').select('mot_cle').eq('actif', true);
  const regles = reglesActives || [];
  function dejaCouverte(libelle){
    const low = (libelle||'').toLowerCase();
    return regles.some(r => low.includes(r.mot_cle.toLowerCase()));
  }

  const operations = await fetchToutesLesLignes(()=>
    sb.from('operations_bancaires').select('libelle, categorie_finale_id, affectation')
      .eq('etat', 'valide_manuel')
      .not('categorie_finale_id', 'is', null)
  );
  if(!operations || operations.length===0){ toast('Aucune opération validée à analyser.'); return; }

  const candidats = new Map();
  operations.forEach(op=>{
    if(dejaCouverte(op.libelle)) return;
    const motCle = suggestKeyword(op.libelle);
    if(!motCle || motCle.length<3) return;
    const affectation = op.affectation || 'COMMUN';
    const cle = motCle.toLowerCase()+'|'+op.categorie_finale_id+'|'+affectation;
    if(!candidats.has(cle)) candidats.set(cle, { mot_cle: motCle, categorie_id: op.categorie_finale_id, affectation });
  });

  if(candidats.size===0){ toast('Rien à générer : toutes les opérations validées sont déjà couvertes par une règle.'); return; }

  const liste = Array.from(candidats.values());
  const apercu = liste.slice(0,8).map(r=>`"${r.mot_cle}"`).join(', ');
  const confirmer = confirm(`${liste.length} règle(s) manquante(s) détectée(s) parmi vos opérations déjà validées.\n\nEx : ${apercu}${liste.length>8?'…':''}\n\nLes créer maintenant ?`);
  if(!confirmer) return;

  let creees = 0, echecs = 0;
  await Promise.all(liste.map(async (r)=>{
    const { error } = await sb.from('regles_categorisation').insert({
      mot_cle: r.mot_cle, categorie_id: r.categorie_id, affectation: r.affectation,
      priorite: 1, confiance: 100, validation_auto: true,
      commentaire: 'Générée depuis les opérations déjà validées'
    });
    if(error){ echecs++; console.error('Erreur création règle :', r.mot_cle, error); } else { creees++; }
  }));
  toast(echecs>0 ? `${creees} règle(s) créée(s), ${echecs} échec(s) (voir la console) ⚠️` : `${creees} règle(s) créée(s) ✔`);
  if(creees>0){
    enregistrerAudit('creation_regle', {
      tableConcernee: 'regles_categorisation',
      resume: `${creees} règle(s) générée(s) automatiquement depuis les opérations déjà validées`,
      details: { mots_cles: liste.slice(0,20).map(r=>r.mot_cle) }
    });
  }
  loadReglesAdmin();
}

async function afficherLignesLieesCategorie(categorieId, tr, toutesCategories){
  // Retirer un éventuel panneau déjà ouvert pour cette ligne
  const existant = document.querySelector(`tr.panneau-liaison[data-pour="${categorieId}"]`);
  if(existant){ existant.remove(); return; }

  const [{ data: ops }, { data: regles }] = await Promise.all([
    sb.from('operations_bancaires')
      .select('id, date_operation, libelle, debit, credit')
      .or(`categorie_finale_id.eq.${categorieId},categorie_proposee_id.eq.${categorieId}`)
      .order('date_operation', {ascending:false})
      .limit(200),
    sb.from('regles_categorisation')
      .select('id, mot_cle')
      .eq('categorie_id', categorieId)
  ]);

  const autresCategories = toutesCategories.filter(c=>c.id!==categorieId && c.actif);
  const nbOps = (ops||[]).length, nbRegles = (regles||[]).length;

  const panneau = document.createElement('tr');
  panneau.className = 'panneau-liaison';
  panneau.dataset.pour = categorieId;
  panneau.innerHTML = `
    <td colspan="3" style="background:#fbfcfe;padding:16px 20px;">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">
        Impossible de supprimer : ${nbOps} opération(s) bancaire(s) et ${nbRegles} règle(s) utilisent encore cette catégorie.
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
        <label style="font-size:13px;color:var(--muted);">Réaffecter tout vers</label>
        <select id="reaffecter-vers-select" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;">
          ${autresCategories.map(c=>`<option value="${c.id}">${escapeHTML(c.libelle)}</option>`).join('')}
        </select>
        <button class="btn small" id="reaffecter-supprimer-btn">Réaffecter puis supprimer</button>
      </div>
      ${nbOps>0 ? `
        <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;">Opérations bancaires concernées :</div>
        <div class="table-wrap" style="margin-bottom:12px;max-height:260px;overflow-y:auto;">
          <table>
            <thead><tr><th>Date</th><th>Libellé</th><th>Montant</th></tr></thead>
            <tbody>
              ${(ops||[]).map(o=>`<tr><td>${fmtDate(o.date_operation)}</td><td style="max-width:300px;white-space:normal;">${escapeHTML(o.libelle)}</td><td>${o.debit?fmtEUR(o.debit):(o.credit?fmtEUR(o.credit):'')}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}
      ${nbRegles>0 ? `
        <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;">Règles du dictionnaire concernées :</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Mot-clé</th></tr></thead>
            <tbody>${(regles||[]).map(r=>`<tr><td>${r.mot_cle}</td></tr>`).join('')}</tbody>
          </table>
        </div>` : ''}
      <div class="hint" style="margin-top:10px;">Vous pouvez aussi laisser cette catégorie désactivée sans la supprimer — elle n'apparaît déjà plus dans les listes de choix.</div>
    </td>
  `;
  tr.after(panneau);

  panneau.querySelector('#reaffecter-supprimer-btn').addEventListener('click', async ()=>{
    const nouvelleCategorieId = panneau.querySelector('#reaffecter-vers-select').value;
    if(!nouvelleCategorieId){ toast('Aucune autre catégorie disponible pour réaffecter.'); return; }
    if(!confirm(`Réaffecter ${nbOps} opération(s) et ${nbRegles} règle(s) vers cette catégorie, puis supprimer l'ancienne ?`)) return;

    await Promise.all([
      sb.from('operations_bancaires').update({ categorie_finale_id: nouvelleCategorieId }).eq('categorie_finale_id', categorieId),
      sb.from('operations_bancaires').update({ categorie_proposee_id: nouvelleCategorieId }).eq('categorie_proposee_id', categorieId),
      sb.from('regles_categorisation').update({ categorie_id: nouvelleCategorieId }).eq('categorie_id', categorieId)
    ]);
    const { error } = await sb.from('categories').delete().eq('id', categorieId);
    if(error){ toast('Réaffectation faite, mais suppression encore impossible : ' + error.message); return; }
    toast('Lignes réaffectées et catégorie supprimée ✔');
    await loadReferenceData();
    loadCategoriesAdmin();

    const libelleSupprime = toutesCategories.find(c=>c.id===categorieId)?.libelle || categorieId;
    const libelleCible = autresCategories.find(c=>c.id===nouvelleCategorieId)?.libelle || nouvelleCategorieId;
    enregistrerAudit('suppression_categorie', {
      tableConcernee: 'categories', elementId: categorieId,
      resume: `Catégorie supprimée : "${libelleSupprime}" — ${nbOps} opération(s) et ${nbRegles} règle(s) réaffectées vers "${libelleCible}"`,
      details: { nb_operations_reaffectees: nbOps, nb_regles_reaffectees: nbRegles, categorie_cible_id: nouvelleCategorieId }
    });
  });
}

  content.innerHTML = `

async function loadJournalVentes(){
  const body = document.getElementById('journal-body');
  const [y,m] = JOURNAL_MOIS.split('-').map(Number);
  const dateDebut = `${JOURNAL_MOIS}-01`;
  const dateFin = toLocalISODate(new Date(y, m, 0));

  const [{ data: journaux }, { data: caRows }] = await Promise.all([
    sb.from('journaux_ventes_mensuels').select('*, magasins(code,nom)').eq('mois', JOURNAL_MOIS),
    sb.from('ca_journalier').select('magasin_id, ca_ht').gte('date_operation', dateDebut).lte('date_operation', dateFin)
  ]);

  if(!journaux || journaux.length===0){
    body.innerHTML = `<div class="empty">Aucun journal des ventes enregistré pour ce mois. Envoyez-moi les PDF "Journal des ventes" de vos 3 magasins pour ce mois, et je les intègre ici.</div>`;
    return;
  }

  const caParMagasin = {};
  (caRows||[]).forEach(r=>{ caParMagasin[r.magasin_id] = (caParMagasin[r.magasin_id]||0) + Number(r.ca_ht||0); });

  const ordre = ['PAU','IBOS','TARBES','INTERNET'];

  body.innerHTML = tries.map(j=>{

    const enfants = STATE.magasins.filter(m=>m.magasin_parent_id===j.magasin_id).map(m=>m.id);

      <div class="grid grid-4">

        <div><div class="kpi-label">TVA collectée</div><div class="kpi-value" style="font-size:20px;">${fmtEUR(j.tva)}</div></div>
        <div><div class="kpi-label">Marge</div><div class="kpi-value" style="font-size:20px;">${fmtEUR(j.marge)}</div><div class="kpi-sub">${j.marge_pct?.toFixed?.(1) ?? j.marge_pct} % du CA</div></div>
        <div><div class="kpi-label">Panier moyen</div><div class="kpi-value" style="font-size:20px;">${fmtEUR(j.panier_moyen)}</div><div class="kpi-sub">${j.nb_tickets} ticket(s)</div></div>
      </div>

      <div class="section-title" style="font-size:13px;">Encaissements</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Espèces</th><th>Carte bancaire</th><th>CB Web</th><th>Shopify (site internet)</th></tr></thead>
          <tbody><tr>
            <td>${j.especes!=null?fmtEUR(j.especes):'—'}</td>
            <td>${j.carte_bancaire!=null?fmtEUR(j.carte_bancaire):'—'}</td>
            <td>${j.cb_web!=null?fmtEUR(j.cb_web):'—'}</td>
            <td>${j.shopify!=null?fmtEUR(j.shopify):'—'}</td>
          </tr></tbody>
        </table>
      </div>
      ${(j.shopify || j.cb_web) ? `<div class="hint" style="margin-top:8px;">🌐 Part liée au site internet dans ce document : ${fmtEUR((Number(j.shopify||0)+Number(j.cb_web||0)))}</div>` : ''}

      <div class="section-title" style="font-size:13px;">Avoirs</div>

/* ============================================================
   VERSION DE L'APPLICATION & MISE À JOUR PWA
   ----------------------------------------------------------------
   version.json est l'UNIQUE source lue par l'application (affichage
   "À propos" et détection de nouvelle version). Le fichier VERSION à
   la racine du dépôt n'est qu'un miroir texte pour les humains — il
   n'est jamais lu ici. Toujours récupéré avec cache:'no-store' pour
   ignorer le cache HTTP du navigateur (voir netlify.toml pour les
   en-têtes côté serveur qui renforcent ce comportement).

   Pas de vérification périodique automatique (volontaire) : la
   détection se déclenche uniquement au chargement, au retour au
   premier plan (visibilitychange), ou via le bouton manuel de la
   section "À propos".
   ============================================================ */
let VERSION_INFO = null;       // dernières infos connues (affichage "À propos")
let VERSION_CHARGEE = null;    // version avec laquelle l'appli a démarré (référence de comparaison)
let VERSION_IGNOREE = null;    // dernière version proposée puis "Plus tard" cette session

async function chargerVersionJson(){
  try{
    const res = await fetch('/version.json', { cache: 'no-store' });
    if(!res.ok) return null;
    return await res.json();
  } catch(err){
    console.error('Impossible de récupérer version.json :', err);
    return null;
  }
}

function majAffichageVersion(info){
  VERSION_INFO = info;
  const label = document.getElementById('app-version-label');
  if(label) label.textContent = `v${info.version}`;
  renderAproposContent();
}

async function initialiserVersion(){
  const info = await chargerVersionJson();
  if(!info) return;
  VERSION_CHARGEE = info.version;
  majAffichageVersion(info);
}

async function verifierMiseAJour({ manuel=false } = {}){
  const info = await chargerVersionJson();
  if(!info){
    if(manuel) toast('Vérification impossible — pas de connexion ?');
    return;
  }
  majAffichageVersion(info); // garde "À propos" à jour même sans nouvelle version

  if(!VERSION_CHARGEE){ VERSION_CHARGEE = info.version; return; } // première mesure de la session

  if(info.version === VERSION_CHARGEE){
    if(manuel) toast('Vous utilisez déjà la dernière version ✔');
    return;
  }
  if(info.version === VERSION_IGNOREE && !manuel) return; // déjà proposée et ignorée cette session

  afficherBanniereMiseAJour(info);
}

function afficherBanniereMiseAJour(info){
  const existante = document.getElementById('update-banner');
  if(existante) existante.remove(); // jamais deux bannières à la fois

  const banniere = document.createElement('div');
  banniere.className = 'update-banner';
  banniere.id = 'update-banner';
  const nouveautes = (info.highlights||[]).slice(0,5).map(h=>`<li>${escapeHTML(h)}</li>`).join('');
  banniere.innerHTML = `
    <h4>Version ${escapeHTML(info.version)} disponible</h4>
    ${nouveautes ? `<div style="font-size:12.5px;font-weight:700;margin-bottom:4px;">Nouveautés :</div><ul>${nouveautes}</ul>` : ''}
    <div class="update-actions">
      <button class="btn secondary small" id="update-plus-tard-btn">Plus tard</button>
      <button class="btn small" id="update-maintenant-btn">Mettre à jour</button>
    </div>
  `;
  document.body.appendChild(banniere);

  document.getElementById('update-plus-tard-btn').addEventListener('click', ()=>{
    VERSION_IGNOREE = info.version;
    banniere.remove();
  });
  document.getElementById('update-maintenant-btn').addEventListener('click', ()=>{
    const actif = document.activeElement;
    const saisieEnCours = actif && ['INPUT','TEXTAREA','SELECT'].includes(actif.tagName);
    if(saisieEnCours && !confirm('Une saisie est peut-être en cours. Recharger quand même ?')) return;
    banniere.innerHTML = `<div style="font-size:13.5px;font-weight:700;">Installation de la mise à jour…</div>`;
    setTimeout(()=> window.location.reload(), 600);
  });
}

/* ============================================================
   ANIMATION DE TRANSITION DE PAGE (Lot F)
   ----------------------------------------------------------------
   Un seul point d'intégration : un observateur sur les enfants DIRECTS
   de #content. Il se déclenche uniquement quand une page entière est
   remplacée (content.innerHTML = ...), jamais sur un rafraîchissement
   partiel (ex. un <tbody> mis à jour après une sauvegarde dans
   Paramètres), puisque ces mutations-là ne touchent pas les enfants
   directs de #content. Aucune modification nécessaire dans chacune des
   fonctions render*Page().
   ============================================================ */
(function(){
  const contenuEl = document.getElementById('content');
  if(!contenuEl || !contenuEl.animate) return;
  const observateurTransition = new MutationObserver(()=>{
    contenuEl.animate(
      [{ opacity:0, transform:'translateY(6px)' }, { opacity:1, transform:'translateY(0)' }],
      { duration:200, easing:'cubic-bezier(.4,0,.2,1)' }
    );
  });
  observateurTransition.observe(contenuEl, { childList:true });
})();

function getModeEtItems(){

    return { mode:'exercice', items };
  }
  const items = Array.from(ANALYSE_ANNEES).sort((a,b)=>a-b);
  return { mode:'annee', items };
}

async function computeKpis(magasin, start, end, predicate){
  const [{data: caRowsRaw}, {data: opRowsRaw}] = await Promise.all([
    sb.from('ca_journalier').select('*')
      .eq('magasin_id', magasin.id)
      .gte('date_operation', start).lte('date_operation', end),
    sb.from('operations_bancaires').select('*, categories:categorie_finale_id(libelle)')
      .eq('affectation', magasin.code)
      .eq('etat', 'valide_manuel')
      .gte('date_operation', start).lte('date_operation', end+'T23:59:59')
  ]);
  const rows = (caRowsRaw||[]).filter(r=>predicate(r.date_operation));
  const caTotal = rows.reduce((s,r)=>s + Number(r.ca_ht||0), 0);
  const tickets = rows.reduce((s,r)=>s + Number(r.nb_tickets||0), 0);
  const panierMoyen = tickets>0 ? caTotal/tickets : null;

  const ops = (opRowsRaw||[]).filter(op=>predicate(op.date_operation));
  const parCategorie = {};
  let totalDepenses = 0;
  ops.forEach(op=>{
    if(!op.debit) return;
    const lib = op.categories?.libelle || 'Sans catégorie';
    parCategorie[lib] = (parCategorie[lib]||0) + Number(op.debit);
    totalDepenses += Number(op.debit);
  });
  return {
    caTotal, tickets, panierMoyen, totalDepenses,
    resultatPartiel: caTotal - totalDepenses,
    categoriesTriees: Object.entries(parCategorie).sort((a,b)=>b[1]-a[1])
  };
}

function evolutionTexte(a, b){
  if(!a || a===0) return '';
  const pct = ((b-a)/a)*100;
  const signe = pct>=0 ? '+' : '';
  const couleur = pct>=0 ? '#1c8a4b' : '#c22b2b';
  return `<span style="color:${couleur};font-weight:700;">${signe}${pct.toFixed(1)} %</span>`;
}

async function loadAnalyseData(){
  const body = document.getElementById('analyse-body');
  const magasin = STATE.magasins.find(m=>m.code===ANALYSE_MAGASIN_CODE);
  if(!magasin){ body.innerHTML = `<div class="empty">Magasin introuvable.</div>`; return; }

  const { mode, items } = getModeEtItems();

  if(ANALYSE_COMPARER){
    let periodeA=null, periodeB=null;
    if(mode==='exercice' && items.length>=2){
      periodeA = { label: items[0].libelle, start: items[0].date_debut, end: items[0].date_fin, predicate: (d)=> d>=items[0].date_debut && d<=items[0].date_fin };
      periodeB = { label: items[1].libelle, start: items[1].date_debut, end: items[1].date_fin, predicate: (d)=> d>=items[1].date_debut && d<=items[1].date_fin };
    } else if(mode==='annee' && items.length===1 && ANALYSE_MOIS.size>=2){
      const moisArr = Array.from(ANALYSE_MOIS).sort((a,b)=>a-b);
      const year = items[0];
      const build = (mois) => {
        const start = `${year}-${String(mois).padStart(2,'0')}-01`;
        const end = toLocalISODate(new Date(year, mois, 0));
        const label = new Date(year, mois-1, 1).toLocaleDateString('fr-FR',{month:'long', year:'numeric'});
        return { label, start, end, predicate:(d)=> d>=start && d<=end };
      };
      periodeA = build(moisArr[0]);
      periodeB = build(moisArr[1]);
    }

    if(!periodeA || !periodeB){
      body.innerHTML = `<div class="empty">Pour comparer, cochez 2 exercices — ou 1 année civile avec 2 mois.</div>`;
      return;
    }

    const [kA, kB] = await Promise.all([
      computeKpis(magasin, periodeA.start, periodeA.end, periodeA.predicate),
      computeKpis(magasin, periodeB.start, periodeB.end, periodeB.predicate)
    ]);

    body.innerHTML = `
      <div class="grid grid-2">
        <div>
          <div class="section-title" style="margin-top:0;text-transform:capitalize;">${escapeHTML(periodeA.label)}</div>
          ${kpiCardsHtml(kA, magasin.nom)}
        </div>
        <div>
          <div class="section-title" style="margin-top:0;text-transform:capitalize;">${escapeHTML(periodeB.label)}</div>
          ${kpiCardsHtml(kB, magasin.nom)}
        </div>
      </div>
      <div class="card" style="margin-top:16px;text-align:center;">
        <div class="kpi-label">ÉVOLUTION DU CA</div>
        <div style="font-size:22px;margin-top:6px;">${evolutionTexte(kA.caTotal, kB.caTotal)}</div>
      </div>
    `;
    return;
  }

  // Mode cumul (par défaut)
  if(items.length===0){
    body.innerHTML = `<div class="empty">Sélectionnez au moins un exercice ou une année.</div>`;
    return;
  }
  let start, end, predicate;
  if(mode==='exercice'){
    start = items.map(e=>e.date_debut).sort()[0];
    end = items.map(e=>e.date_fin).sort().slice(-1)[0];
    predicate = (dateStr) => {
      const d = new Date(dateStr);
      const inAny = items.some(e=> dateStr >= e.date_debut && dateStr <= e.date_fin);
      return inAny && (ANALYSE_MOIS.size===0 || ANALYSE_MOIS.has(d.getMonth()+1));
    };
  } else {
    const minY = Math.min(...items), maxY = Math.max(...items);
    start = `${minY}-01-01`; end = `${maxY}-12-31`;
    predicate = (dateStr) => {
      const d = new Date(dateStr);
      return items.includes(d.getFullYear()) && (ANALYSE_MOIS.size===0 || ANALYSE_MOIS.has(d.getMonth()+1));
    };
  }

  const k = await computeKpis(magasin, start, end, predicate);
  body.innerHTML = kpiCardsHtml(k, magasin.nom) + `
    <div class="hint" style="margin-top:10px;">Seules les opérations bancaires <b>validées</b> et affectées à ${escapeHTML(magasin.nom)} sont comptées. Les charges communes (COMMUN) ne sont pas incluses tant que la règle de répartition n'est pas configurée.</div>
  `;
}


async function validerOperation(tr){
  const id = tr.dataset.id;
  const etaitDejaValidee = tr.dataset.etat === 'valide_manuel';
  const ancienneCategorieId = tr.dataset.categorieFinale || null;
  const ancienneAffectation = tr.dataset.affectation || null;
  const categorieId = tr.querySelector('.cat-select').value;
  const affectation = tr.querySelector('.aff-select').value;
  if(!categorieId){ toast('Choisissez une catégorie avant de valider.'); return; }

  const { error } = await sb.from('operations_bancaires').update({
    categorie_finale_id: categorieId,
    affectation: affectation || 'COMMUN',
    etat: 'valide_manuel',
    valide_manuellement: true
  }).eq('id', id);

  if(error){ toast('Erreur : ' + error.message); return; }
  toast('Opération validée ✔');

  // Une opération déjà validée qu'on modifie à nouveau sort du flux normal
  // de catégorisation (qui n'est pas journalisé) — celle-ci l'est.
  if(etaitDejaValidee){
    const catMap = new Map(STATE.categories.map(c=>[c.id, c.libelle]));
    const libelleOp = tr.children[2].textContent.trim();
    enregistrerAudit('modification_operation_validee', {
      tableConcernee: 'operations_bancaires',
      elementId: id,
      resume: `Opération déjà validée modifiée : "${libelleOp}" — catégorie ${catMap.get(ancienneCategorieId)||'—'} → ${catMap.get(categorieId)||'—'}${ancienneAffectation!==(affectation||'COMMUN') ? `, affectation ${ancienneAffectation||'—'} → ${affectation||'COMMUN'}` : ''}`,
      details: { ancienne_categorie_id: ancienneCategorieId, nouvelle_categorie_id: categorieId, ancienne_affectation: ancienneAffectation, nouvelle_affectation: affectation||'COMMUN' },
      gravite: 'avertissement'
    });
  }

  // Proposer de mémoriser la règle, avec un mot-clé pertinent et modifiable
  const libelle = tr.children[2].textContent.trim();
  const suggestion = suggestKeyword(libelle);
  const motCle = prompt(
    `Mémoriser cette catégorisation pour les prochains imports ?\n\nModifiez le mot-clé si besoin (laissez vide puis OK, ou Annuler, pour ne pas mémoriser) :`,
    suggestion
  );
  if(motCle && motCle.trim()){
    const { error: insertErr } = await sb.from('regles_categorisation').insert({
      mot_cle: motCle.trim(),
      categorie_id: categorieId,
      affectation: affectation || 'COMMUN',
      priorite: 1,
      confiance: 100,
      validation_auto: true,
      commentaire: 'Ajoutée automatiquement depuis le contrôle des opérations'
    });
    if(insertErr){
      alert('La règle n\'a pas pu être enregistrée :\n' + insertErr.message);
    } else {
      const nbMaj = await appliquerReglePassee(motCle.trim(), categorieId, affectation, id);
      toast(nbMaj > 0
        ? `Règle mémorisée — ${nbMaj} opération(s) déjà importée(s) mise(s) à jour automatiquement ✔`
        : 'Règle mémorisée pour les prochains imports ✔');
      enregistrerAudit('creation_regle', { tableConcernee: 'regles_categorisation', resume: `Règle créée : mot-clé "${motCle.trim()}" (depuis une validation)` });
    }
  }
  loadControleRows();
}

// Applique une règle nouvellement créée à toutes les opérations déjà importées
// (dans l'exercice courant) qui contiennent le même mot-clé et ne sont pas encore validées.
async function appliquerReglePassee(motCle, categorieId, affectation, idAExclure){
  let q = sb.from('operations_bancaires')
    .update({
      categorie_finale_id: categorieId,
      affectation: affectation || 'COMMUN',
      etat: 'valide_manuel',
      valide_manuellement: true,
      mot_cle_reconnu: motCle,
      confiance: 100
    })
    .ilike('libelle', `%${motCle}%`)
    .neq('etat', 'valide_manuel')
    .select('id');
  const { data, error } = await q;
  if(error){ console.error('Erreur application rétroactive :', error); return 0; }
  return data ? data.length : 0;
}

function updateSelectionCount(){
  const n = document.querySelectorAll('.row-check:checked').length;
  const btnValider = document.getElementById('valider-selection-btn');
  const btnNonRequis = document.getElementById('marquer-selection-non-requis-btn');
  if(btnValider){ btnValider.textContent = `☑️ Valider la sélection (${n})`; btnValider.disabled = n===0; }
  if(btnNonRequis){ btnNonRequis.textContent = `🧾 Sans justificatif (sélection) (${n})`; btnNonRequis.disabled = n===0; }
}

async function marquerSelectionNonRequis(){
  const checked = Array.from(document.querySelectorAll('.row-check:checked'));
  if(checked.length===0) return;
  if(!confirm(`Marquer "sans justificatif" pour les ${checked.length} opération(s) sélectionnée(s) ?`)) return;
  await Promise.all(checked.map(cb=>
    sb.from('operations_bancaires').update({ justificatif_non_requis: true }).eq('id', cb.dataset.id)
  ));
  toast(`${checked.length} opération(s) marquée(s) "sans justificatif" ✔`);
  loadControleRows();
}

async function validerSelection(){
  const checked = Array.from(document.querySelectorAll('.row-check:checked'));
  if(checked.length===0) return;
  if(!confirm(`Valider les ${checked.length} opération(s) sélectionnée(s) avec la catégorie et l'affectation actuellement affichées ?`)) return;

  const { data: reglesActives } = await sb.from('regles_categorisation').select('mot_cle, categorie_id').eq('actif', true);
  const regles = reglesActives || [];
  function dejaCouverte(libelle){
    const low = (libelle||'').toLowerCase();
    return regles.some(r => low.includes(r.mot_cle.toLowerCase()));
  }

  let manquantes = 0, ok = 0;
  const candidatsRegles = new Map(); // cle: motcle|categorie|affectation
  const dejaValideesModifiees = []; // libellés des opérations déjà validées re-modifiées ici

  await Promise.all(checked.map(async (cb)=>{
    const tr = cb.closest('tr');
    const etaitDejaValidee = tr.dataset.etat === 'valide_manuel';
    const categorieId = tr.querySelector('.cat-select').value;
    const affectation = tr.querySelector('.aff-select').value || 'COMMUN';
    if(!categorieId){ manquantes++; return; }
    const libelle = tr.children[2].textContent.trim();
    const { error } = await sb.from('operations_bancaires').update({
      categorie_finale_id: categorieId,
      affectation: affectation,
      etat: 'valide_manuel',
      valide_manuellement: true
    }).eq('id', cb.dataset.id);
    if(!error){
      ok++;
      if(etaitDejaValidee) dejaValideesModifiees.push(libelle);
      if(!dejaCouverte(libelle)){
        const motCle = suggestKeyword(libelle);
        if(motCle && motCle.length>=3){
          candidatsRegles.set(motCle.toLowerCase()+'|'+categorieId+'|'+affectation, { mot_cle: motCle, categorie_id: categorieId, affectation });
        }
      }
    }
  }));

  if(manquantes>0) toast(`${manquantes} ligne(s) ignorée(s) car sans catégorie choisie.`);
  toast(`${ok} opération(s) validée(s) ✔`);

  if(dejaValideesModifiees.length>0){
    enregistrerAudit('modification_operation_validee', {
      tableConcernee: 'operations_bancaires',
      resume: `${dejaValideesModifiees.length} opération(s) déjà validée(s) modifiée(s) via une validation groupée`,
      details: { libelles: dejaValideesModifiees.slice(0,20) },
      gravite: 'avertissement'
    });
  }

  if(candidatsRegles.size>0){
    const liste = Array.from(candidatsRegles.values());
    const apercu = liste.slice(0,5).map(r=>`"${r.mot_cle}"`).join(', ');
    const memoriser = confirm(`Mémoriser ${liste.length} nouvelle(s) règle(s) pour les prochains imports ?\n\nEx : ${apercu}${liste.length>5?'…':''}`);
    if(memoriser){
      let totalMaj = 0, creees = 0, echecs = 0;
      await Promise.all(liste.map(async (r)=>{
        const { error } = await sb.from('regles_categorisation').insert({
          mot_cle: r.mot_cle, categorie_id: r.categorie_id, affectation: r.affectation,
          priorite: 1, confiance: 100, validation_auto: true,
          commentaire: 'Ajoutée automatiquement depuis une validation groupée'
        });
        if(error){ echecs++; console.error('Erreur création règle :', r.mot_cle, error); return; }
        creees++;
        totalMaj += await appliquerReglePassee(r.mot_cle, r.categorie_id, r.affectation);
      }));
      toast(echecs>0
        ? `${creees} règle(s) mémorisée(s), ${echecs} échec(s) (voir la console) ⚠️`
        : `${creees} règle(s) mémorisée(s) — ${totalMaj} autre(s) opération(s) mise(s) à jour dans tous les exercices ✔`);
      if(creees>0){
        enregistrerAudit('creation_regle', {
          tableConcernee: 'regles_categorisation',
          resume: `${creees} règle(s) créée(s) depuis une validation groupée`,
          details: { mots_cles: liste.slice(0,20).map(r=>r.mot_cle) }
        });
      }
    }
  }

  loadControleRows();
}

function suggestKeyword(libelle){
  const prefixes = [
    'virement émis - vir inst vers', 'virement reçu - vir inst de', 'virement émis -', 'virement reçu -',
    'virement -', 'prélèvement -', 'prelevement -', 'remise carte -', 'paiement par carte -',
    'retrait -', 'prlv -', 'cotisation -'
  ];
  let s = libelle.trim();
  let low = s.toLowerCase();
  for(const p of prefixes){
    if(low.startsWith(p)){ s = s.slice(p.length).trim(); low = s.toLowerCase(); break; }
  }
  const words = s.split(/\s+/).filter(w => w.length>1 && !/^\d+$/.test(w));
  return words.slice(0,2).join(' ');
}
